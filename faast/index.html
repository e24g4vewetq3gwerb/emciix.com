tion TO(e){let t=e?.code??``,n=e?.message??``;return/unavailable|internal|not-found|deadline/.test(t)||/^(internal|unavailable|not-found|deadline-exceeded|INTERNAL|NOT_FOUND)$/.test(n)}function EO(){return G(`div`,{class:`banner banner-warn`,role:`note`,"data-testid":`washer-supplies`},q(`wash`,20),G(`div`,{class:`grow`},G(`strong`,{class:`block`,text:V(`lm_washerSuppliesTitle`)}),G(`span`,{class:`small`,text:V(`lm_washerSupplies`)})))}var DO=iS,OO=DO,kO=`EMCIIX INC.`,AO=`October 2, 2026`,jO={terms:{title:`Terms of Service`,titleFr:`Conditions d’utilisation`,intro:`These Terms govern your use of the Faast Wash app and website ("Faast Wash"). Faast Wash is operated by ${kO}, a business based in Ontario, Canada ("EMCIIX INC.", "we", "us"). By creating an account or booking a wash you agree to these Terms.`,sections:[{h:`1. What Faast Wash is`,p:[`Faast Wash is a marketplace that connects car owners ("Owners") with independent car washers ("Washers") who come to where the car is parked.`,`EMCIIX INC. is not a car-wash company and does not perform washes. Washers are independent businesses, not employees, agents or contractors of EMCIIX INC. The wash itself is a contract between the Owner and the Washer.`,`Where: Faast Wash is open only inside its launch area, currently about 6 km around downtown Sault Ste. Marie, Ontario. Requests and offers outside the launch area are not accepted ("Coming soon to your area").`,`Preview: Faast Wash has not launched yet. Booking, offers and booking chat open at launch; until then, signed-in users are on the waitlist. Support chat is available now.`]},{h:`2. Accounts and eligibility`,p:[`You must be at least 18 years old and able to enter a binding contract in Ontario. You sign in with your email address and mobile phone number, each confirmed with a one-time code (or, until code sign-in is switched on, a one-time email link). New accounts must verify both before they can book, offer, chat about a booking or rate; keep your email account and phone secure. Google, Apple and X sign-in are no longer offered: if you used one, add a verified email and phone in Settings to keep access. You are responsible for activity on your Faast Wash account. Other users see you by a generated display handle (for example "Owner 1093").`,`Washers must register (legal name, contact, service area, services), verify their identity with Stripe Identity (a government photo ID and a matching selfie, checked by Stripe) and be approved by the Faast Wash team before they can see requests or send offers, and confirm that they carry insurance appropriate for the work they do.`]},{h:`3. Prices, payment and the booking fee`,p:[`Owners don’t set or see a suggested price: Washers set their own price in their offers and the Owner picks one. The agreed wash price is paid by the Owner directly to the Washer (for example cash, Interac e-Transfer or tap), and Washers keep 100% of it. EMCIIX INC. does not collect or hold the wash price.`,`Booking fee: when an Owner confirms a booking, EMCIIX INC. charges a booking fee of $2.99 CAD ($4.99 CAD for a full detail), paid by card through Stripe before the Washer is booked. Free bookings: each Owner’s 2nd booking is fee-free (once), and every 10th booking stays fee-free (the 10th, 20th, 30th and so on). A booking counts once it is confirmed and stops counting if it is cancelled. The app shows the fee, or that the booking is free, before you confirm. If card collection is paused, the app shows the fee as not collected and nothing is charged. Washers are never charged a fee by EMCIIX INC.`,`Washers set their own price, carry their own insurance, and are paid directly. EMCIIX INC. does not insure the wash, the vehicle or anyone involved.`,`Taxes: the booking fee is a taxable supply. Where EMCIIX INC. is registered for GST/HST, 13% Ontario HST applies to the booking fee and will be shown on your receipt. Washers are responsible for their own income tax and, if they are registrants (for example above the $30,000 small-supplier threshold), for charging and remitting GST/HST on their wash price.`,`When card payments launch, booking fees will be processed by our payment provider (Stripe). Card details will be handled by Stripe and never stored by EMCIIX INC. Customers can add an optional tip after the wash; tips are paid directly to the Washer with the wash price.`,`Services and site needs: Exterior is a waterless hand wash (no water or power needed). Interior needs no water but may need power. Full Detail may need water and power access. Owners should say in the request whether a hose and an outlet are available.`]},{h:`4. Cancellations and refunds of the booking fee`,p:[`These rules apply to booking fees that were charged; a free booking, or one whose fee was not collected, has nothing to refund.`,`Owner cancels before the Washer is on the way: booking fee refunded. Owner cancels after the Washer is on the way: no refund.`,`Washer cancels, or does not arrive within 15 minutes of the estimated arrival time: booking fee refunded and the Washer receives a strike.`,`Disputes about the quality of a wash or damage are between the Owner and the Washer; you can report a problem in the app and we will review it, and we may refund the booking fee where a complaint is upheld. Your rights under the Ontario Consumer Protection Act, 2002 are not affected.`]},{h:`5. Your conduct`,p:[`Be honest, respectful and safe. Do not harass, threaten or discriminate against anyone (the Ontario Human Rights Code applies), post illegal or offensive content, misrepresent a vehicle or service, or use Faast Wash for anything other than arranging car washes.`,`Before a booking is confirmed, chat filters block phone numbers, emails, links and social handles so that bookings stay in the app. Once the Owner confirms a Washer, they can share them in that booking’s chat.`,`Washers must only perform the services agreed, use products that are safe for the vehicle and the location, follow local by-laws, and not enter a vehicle without the Owner’s permission.`]},{h:`6. Ratings, reports and moderation`,p:[`Owners and Washers can rate each other after a job. You can report users or content and block people at any time. We review reports and may remove content, suspend or ban accounts that break these Terms or our Community & Safety Guidelines.`]},{h:`7. Location and photos`,p:[`The exact location of a car, the address and the notes are shared only with the Washer who is booked for it. Before booking, Washers see only an approximate area (about 500 m). While a job is active, the Washer’s live location is shared with that Owner only, and only while the app is open. See the Privacy Policy.`]},{h:`8. Liability`,p:[`Faast Wash is provided "as is". To the extent permitted by law, EMCIIX INC. is not liable for the acts or omissions of Owners or Washers, for damage to vehicles or property, or for indirect or consequential losses. Our total liability to you for any claim is limited to the booking fees you paid in the 12 months before the claim. Nothing in these Terms limits liability that cannot be limited under Ontario law.`]},{h:`9. Ending your account`,p:[`You can delete your account at any time in Settings > Delete account, or by emailing us. We may suspend or close accounts that break these Terms.`]},{h:`10. Changes and governing law`,p:[`We may update these Terms; we will tell you in the app before material changes take effect. These Terms are governed by the laws of Ontario and the federal laws of Canada that apply there, and disputes are heard in the courts of Ontario.`,`Questions: ${OO}.`]}]},privacy:{title:`Privacy Policy`,titleFr:`Politique de confidentialité`,intro:`This policy explains what personal information ${kO} collects through Faast Wash, why, and your choices. We follow the Personal Information Protection and Electronic Documents Act (PIPEDA). Our privacy contact is reachable at ${OO}.`,sections:[{h:`1. What we collect`,p:[`Account: we do not ask for your name or photo. You sign in with your email address and your mobile phone number, each confirmed with a one-time 6-digit code: the email code is sent by our own server function, the text code by Firebase Authentication (until email codes are switched on, the email step uses a one-time sign-in link instead). After signing up you can optionally add a username and a password in Settings › Account to log in without a code: the password is stored only by Firebase Authentication (hashed; we never see it), the username is used only to log in, is never shown to other people, and looking it up never reveals your email. Your email address or phone number is used only to sign you in: it is kept in your login record with our authentication service (Google Firebase Authentication), never copied into our database, logs or notifications, never shown to other users, and never used for marketing or to contact you (the only messages are the sign-in codes or link you ask for). Sign-in codes: an email code is stored only as a salted one-way hash, expires after 10 minutes and is deleted after use or after 5 wrong tries; to prevent abuse we also keep hourly counts of code requests per email address and per network address, both identified only by a one-way hash. Our database keeps a random Faast Wash user ID, a generated display handle (for example "Owner 1093"), your role (Owner/Washer), language and the booking data below. Former social sign-in: accounts created before October 2026 may still have a Google, Apple or X login attached. We clear any name from your login profile and never use it.`,`Connected accounts: Settings shows your verified email and phone (and any older Google, Apple or X login still attached). If a method already belongs to another Faast Wash account, you can merge the two after confirming: we move the profile, vehicles and past bookings into the older account (keeping its handle), keep the other account’s support messages readable to you, and delete the other login. We store only a link between the two account IDs.`,`Phone sign-in: to send the text code, Firebase Authentication uses Google reCAPTCHA to block automated abuse, and an SMS carrier delivers the message. Standard message and data rates may apply.`,`If you signed in with Apple, Google or X in the past, that provider holds your email address and other account details under its own privacy policy. To complete a sign-in, our authentication service (Google Firebase Authentication) receives what the provider supplies: always a provider account ID and, depending on the provider and your settings, your email address, name and profile photo. Firebase Authentication may retain these internally as part of your login record. We clear the name and photo from your login profile, never copy any of it into our database, logs or notifications, never show it to other users and never use it to contact you. It is deleted with your login when you delete your account.`,`Vehicles: make, model, colour, size and optional plate.`,`Requests and jobs: service, price, time, the car’s exact location, address and notes, photos of the car (before/after), job status history, ratings and comments.`,`Location: when you choose "Use my location" while booking; for Washers who are online, an approximate position (rounded to about 300 m) so Owners can see roughly where Washers are; during an active job, the Washer’s exact position, shared only with that job’s Owner. Location is used only while the app is open; Faast Wash never tracks location in the background.`,`Messages between an Owner and a Washer about a request, and reports and blocks you make.`,`Support chat: if you use the live chat on the website, we store your messages, the time of each message, your generated handle, your role (Customer/Washer) and language, so we can answer your request. The chat never asks for your name, email or phone number; please don’t share card numbers, passwords or other sensitive details in it. Support chat is stored in Google Firebase Realtime Database in the United States, and only you and Faast support can read your conversation.`,`Washer registration: legal name, phone or email, service area, services, equipment, vehicle and availability. Your legal name and contact are seen only by the Faast Wash team, never by customers.`,`Washer identity verification: Faast Wash does not collect or store photos of your ID or selfies. Verification is done by Stripe Identity on Stripe’s own page, under Stripe’s privacy policy (stripe.com/privacy); Stripe collects the ID document and selfie. We receive and keep only the result (for example verified or needs another try), the Stripe verification session ID and, if it failed, an error code.`,`Earnings: for each completed booking, a Washer’s earnings record (agreed price, tip, how it was paid, and payout status), and any adjustments or payouts the admin records.`,`Payments: booking fees are paid by card on Stripe’s hosted checkout page; Stripe processes the payment (and, if enabled, Washer payouts via Stripe Connect) under its privacy policy. We receive the payment status, amount and Stripe IDs, never your full card number, and we keep a record of which bookings were charged or free.`,`Device: push notification token (if you allow notifications), app preferences (such as your navigation app), and basic technical logs for security and troubleshooting (these never include your email address or name).`]},{h:`2. Why we use it`,p:[`To run the marketplace: check that requests are inside the launch area, show requests to nearby Washers, send offers, confirm bookings, share the exact location with the booked Washer, show live arrival and, once card payments launch, process booking fees and refunds.`,`Waitlist: before launch, signing in keeps your profile (handle and role) so you are on the waitlist. We do not send automated waitlist emails; if you email us to join the waitlist, we use your email address only to reply and to let you know at launch.`,`To keep people safe: identity verification, chat filtering before booking, reports, blocks and moderation, fraud prevention.`,`To send notifications you asked for (new offers, messages, job updates) and to provide support.`,`We do not sell personal information and we do not use it for third-party advertising.`]},{h:`3. Who we share it with`,p:[`The other party to your booking: Washers see an approximate area before booking and the exact location, address and notes after the booking is confirmed (the database rules enforce this); contact details can be shared in chat only after booking; Owners see the Washer’s display handle, rating and, during the job, live location. Neither side sees the other’s email address or real name.`,`Service providers acting for us: Google Firebase (authentication, including text codes and sign-in links, and reCAPTCHA; database, file storage, server functions that send email codes, and website hosting), an email delivery provider (only to deliver the sign-in code to your address, once email codes are switched on), Apple, Google and X (only for older accounts still signed in that way), Stripe (payments, once online payment launches, and washer identity verification with Stripe Identity), Expo (push notification delivery in the mobile app), and map tiles from OpenStreetMap and Esri on the website.`,`Some providers store or process data outside Canada, including in the United States (for example our main database is in a US multi-region; server functions and photo storage are in Montréal). Information stored abroad may be accessible to authorities there under local law.`,`Authorities, when required by law or to protect someone’s safety.`]},{h:`4. How long we keep it`,p:[`Your profile, vehicles, open requests and photos, and your login record (your sign-in email address or phone number, and anything Firebase Authentication kept from your sign-in provider), are deleted when you delete your account. Messages you sent are replaced with "[deleted]".`,`Records of completed jobs, ratings, booking fees and Washer earnings and payouts are kept, without your profile, for disputes and as required by Canadian tax law (generally six years).`,`We keep no ID photos. Stripe keeps verification data according to its own retention policy; you can ask Stripe to delete it.`,`Support chat conversations are kept while we need them to answer and follow up on your request. To have yours deleted, email ${OO}.`]},{h:`5. Your choices and rights`,p:[`You can access and correct your profile in the app, turn notifications off in Settings, deny or revoke location permission in your device settings (you can still type an address), and delete your account in Settings > Delete account.`,`Under PIPEDA you can ask for access to, or correction of, the personal information we hold about you, and withdraw consent (which may mean we can no longer provide the service). Email ${OO}; we respond within 30 days.`,`If you are not satisfied with our answer, you can complain to the Office of the Privacy Commissioner of Canada (priv.gc.ca).`]},{h:`6. Security`,p:[`Data is encrypted in transit; access is limited by role-based rules (for example, only the booked Washer can read a car’s exact location). If a breach creates a real risk of significant harm, we will notify affected people and the Privacy Commissioner as PIPEDA requires.`]},{h:`7. Website storage`,p:[`The website uses your browser’s local storage to keep you signed in and remember preferences (language, map style, navigation app). We do not use advertising or analytics trackers.`]},{h:`8. Children`,p:[`Faast Wash is for people 18 and older. We do not knowingly collect information from minors.`]},{h:`9. Changes`,p:[`We will post updates here and tell you in the app about material changes. Last updated ${AO}.`]}]},safety:{title:`Community & Safety Guidelines`,titleFr:`Règles de la communauté et de sécurité`,intro:`Faast Wash works because Owners and Washers can trust each other. These guidelines apply to everyone; breaking them can lead to removal from Faast Wash.`,sections:[{h:`Everyone`,p:[`Be respectful. No harassment, threats, hate or discrimination of any kind.`,`Keep communication in the app until a booking is confirmed (contact details are blocked in chat before booking).`,`Report anything unsafe or inappropriate with the flag button on a profile, message or job, and block anyone you don’t want to hear from. We aim to review reports within 24 hours.`,`In an emergency, call 911 first.`]},{h:`Owners`,p:[`Describe the car and its location accurately, and make sure it is parked where a wash is allowed (ask your building or lot if unsure).`,`Remove valuables before an interior service and only give access you are comfortable with.`,`Pay the agreed price directly to the Washer when the job is done, and confirm payment in the app.`]},{h:`Washers`,p:[`Complete identity verification and keep your insurance current.`,`Do only the services agreed, use products safe for the vehicle and the surroundings (Faast Wash favours waterless washing), and respect local by-laws and property rules.`,`Never enter a vehicle without the Owner’s permission. Take the before and after photos the app asks for.`,`If you can’t make it, cancel as early as possible. Missing a booking (15 minutes past your arrival estimate without arriving) results in a strike.`]},{h:`Winter`,p:[`Snow and ice services: watch for traffic and ice underfoot, never use hot water on glass, and don’t block driveways or sidewalks with cleared snow.`]},{h:`Enforcement`,p:[`Depending on severity we may warn, remove content, suspend or permanently ban an account, and we cooperate with police when required by law.`]}]}},MO={title:`Support`,titleFr:`Soutien`,intro:`Questions, problems with a booking, or a safety concern? Email ${OO}. We aim to reply within 2 business days (safety reports within 24 hours).`,sections:[{h:`Where and when can I book?`,p:[`Faast Wash opens first in Sault Ste. Marie, Ontario (about 6 km around downtown). Outside that area you’ll see “Coming soon to your area”. Booking, offers and booking chat open at launch; sign in now to join the waitlist and we’ll let you know at launch. Support chat works today.`]},{h:`Is the wash insured?`,p:[`Washers set their own price, carry their own insurance, and are paid directly. Faast does not insure the wash.`]},{h:`Do washers need water or power?`,p:[`Exterior is a waterless hand wash: no water or power needed. Interior needs no water but may need power. Full Detail may need water and power access; the booking asks whether a hose and an outlet are available.`]},{h:`What do washers see before I book?`,p:[`Only an approximate area (about 500 m). Your exact spot, address and notes unlock for the washer you confirm, and contact details can be shared in chat only after booking.`]},{h:`How does payment work?`,p:[`You pay the washer the agreed price directly (cash, e-Transfer or tap). When you confirm a washer, Faast charges a small booking fee by card through Stripe ($2.99, or $4.99 for a full detail). Your 2nd booking is free, and every 10th booking (10th, 20th, 30th…) stays free; the app shows the fee or “Free” before you confirm.`]},{h:`Can I get the booking fee back?`,p:[`A free booking has nothing to refund. For a booking fee you paid: yes if you cancel before the washer is on the way, if the washer cancels or doesn’t show up, or if a complaint is upheld. See the Terms of Service, section 4.`]},{h:`How do I report someone?`,p:[`Tap the flag on their profile, message or job. You can also block them. For urgent safety issues call 911, then email us.`]},{h:`How do I sign up or sign in?`,p:[`Enter your email address and confirm it with the 6-digit code we email you (until email codes are switched on, with a one-time sign-in link), then your mobile number and the 6-digit code we text you. Both are needed before you can book, offer or chat about a booking. Codes expire after 10 minutes; you can ask for a new one after 30 seconds. Next time, sign in with either your email or your phone. You can also add an optional username and password in Settings › Account and log in with your email or username and password; setting, changing or resetting the password (“Forgot password”) needs a 6-digit code emailed to you. Log in attempts are rate-limited. Google, Apple and X sign-in are no longer offered: if you used one, sign in with the same email address (or, if you are still signed in, add your email and phone when asked) to keep your account. If you can’t, email us from that address.`]},{h:`How do I delete my account?`,p:[`In the app: Settings > Delete account. This deletes your profile, vehicles, open requests and photos. You can also email ${OO} from the email address you sign in with, or include your display handle.`]},{h:`How do washers get verified?`,p:[`Washers apply from the Wash cars side of the dashboard, then verify their identity with Stripe Identity (government photo ID and a selfie, on Stripe’s secure page; not switched on yet, so for now the Faast Wash team reviews each application by hand). The Faast Wash team then approves or rejects with a reason; review takes about 24 hours. Only approved washers can see requests and send offers. Faast Wash never collects or stores ID photos.`]}]},NO=(e,t)=>e(`svc_${t}`),PO=(e,t)=>e(`svcd_${t}`),FO=(e,t)=>e(`size_${t}`),IO=(e,t)=>e(`jobStatus_${t}`),LO=(e,t)=>t.map(t=>e(`pm_${t}`)).join(`, `)||e(`none`),$=(e,t)=>Qw(e,t),RO=e=>e===`fr`?`fr-CA`:`en-CA`;function zO(e,t,n){return n===`asap`?e(`when_asap`):new Date(n).toLocaleString(RO(t),{weekday:`short`,hour:`numeric`,minute:`2-digit`})}function BO(e,t){let n=Math.round((Date.now()-t)/6e4);return n<1?e(`justNow`):e(`postedAgo`,{m:n})}var VO=(e,t)=>new Date(t).toLocaleDateString(RO(e),{month:`short`,day:`numeric`}),HO=(e,t)=>new Date(t).toLocaleTimeString(RO(e),{hour:`numeric`,minute:`2-digit`}),UO=[`verification_required`,`contact_blocked`,`objectionable`,`not_open`,`blocked`,`outside_launch
