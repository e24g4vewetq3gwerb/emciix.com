 business based in Ontario, Canada ("EMCIIX", "we", "us"). By creating an account or booking a wash you agree to these Terms.`,sections:[{h:`1. What Faast Wash is`,p:[`Faast Wash is a marketplace that connects car owners ("Owners") with independent car washers ("Washers") who come to where the car is parked.`,`EMCIIX is not a car-wash company and does not perform washes. Washers are independent businesses, not employees, agents or contractors of EMCIIX. The wash itself is a contract between the Owner and the Washer.`]},{h:`2. Accounts and eligibility`,p:[`You must be at least 18 years old and able to enter a binding contract in Ontario. You sign in with Apple, Google or X: keep that account secure; you are responsible for activity on your Faast Wash account. Other users see you by a generated display handle (for example "Owner 1093").`,`Washers must complete identity verification (ID document and selfie, processed by our verification provider) before they can go online or send offers, and confirm that they carry insurance appropriate for the work they do.`]},{h:`3. Prices, payment and the booking fee`,p:[`Owners suggest a price; Washers can accept it or counter. The agreed wash price is paid by the Owner directly to the Washer (for example cash, Interac e-Transfer or tap), and Washers keep 100% of it. EMCIIX does not collect or hold the wash price.`,`When an Owner confirms a booking, EMCIIX charges the Owner a booking fee: currently $2.99 CAD, or $4.99 CAD for a full detail. Every 10th completed booking is fee-free. Washers are never charged a fee by EMCIIX.`,`Taxes: the booking fee is a taxable supply. Where EMCIIX is registered for GST/HST, 13% Ontario HST applies to the booking fee and will be shown on your receipt. Washers are responsible for their own income tax and, if they are registrants (for example above the $30,000 small-supplier threshold), for charging and remitting GST/HST on their wash price.`,`Booking fees are processed by our payment provider (Stripe). Card details are handled by Stripe and are never stored by EMCIIX.`]},{h:`4. Cancellations and refunds of the booking fee`,p:[`Owner cancels before the Washer is on the way: booking fee refunded. Owner cancels after the Washer is on the way: no refund.`,`Washer cancels, or does not arrive within 15 minutes of the estimated arrival time: booking fee refunded and the Washer receives a strike.`,`Disputes about the quality of a wash or damage are between the Owner and the Washer; you can report a problem in the app and we will review it, and we may refund the booking fee where a complaint is upheld. Your rights under the Ontario Consumer Protection Act, 2002 are not affected.`]},{h:`5. Your conduct`,p:[`Be honest, respectful and safe. Do not harass, threaten or discriminate against anyone (the Ontario Human Rights Code applies), post illegal or offensive content, misrepresent a vehicle or service, or use Faast Wash for anything other than arranging car washes.`,`Before a booking is confirmed, chat filters block phone numbers, emails, links and social handles so that bookings stay in the app.`,`Washers must only perform the services agreed, use products that are safe for the vehicle and the location, follow local by-laws, and not enter a vehicle without the Owner’s permission.`]},{h:`6. Ratings, reports and moderation`,p:[`Owners and Washers can rate each other after a job. You can report users or content and block people at any time. We review reports and may remove content, suspend or ban accounts that break these Terms or our Community & Safety Guidelines.`]},{h:`7. Location and photos`,p:[`The exact location of a car is shared only with the Washer who is booked for it. Before booking, Washers see an approximate area. While a job is active, the Washer’s live location is shared with that Owner only, and only while the app is open. See the Privacy Policy.`]},{h:`8. Liability`,p:[`Faast Wash is provided "as is". To the extent permitted by law, EMCIIX is not liable for the acts or omissions of Owners or Washers, for damage to vehicles or property, or for indirect or consequential losses. Our total liability to you for any claim is limited to the booking fees you paid in the 12 months before the claim. Nothing in these Terms limits liability that cannot be limited under Ontario law.`]},{h:`9. Ending your account`,p:[`You can delete your account at any time in Settings > Delete account, or by emailing us. We may suspend or close accounts that break these Terms.`]},{h:`10. Changes and governing law`,p:[`We may update these Terms; we will tell you in the app before material changes take effect. These Terms are governed by the laws of Ontario and the federal laws of Canada that apply there, and disputes are heard in the courts of Ontario.`,`Questions: ${lx}.`]}]},privacy:{title:`Privacy Policy`,titleFr:`Politique de confidentialité`,intro:`This policy explains what personal information ${dx} collects through Faast Wash, why, and your choices. We follow the Personal Information Protection and Electronic Documents Act (PIPEDA). Our privacy contact is reachable at ${lx}.`,sections:[{h:`1. What we collect`,p:[`Account: we do not ask for, or store in our database, your name, email address, phone number, photo or a password. You sign in with Apple, Google or X, and we keep only a provider account ID (which links that sign-in to a random Faast Wash user ID) and a generated display handle (for example "Owner 1093"), plus your role (Owner/Washer), language and the booking data below. We request the least each provider allows: no name or email scopes from Apple, no extra scopes from Google beyond what sign-in itself requires, and none from X.`,`Your sign-in provider (Apple, Google or X) holds your email address and other account details under its own privacy policy. To complete a sign-in, our authentication service (Google Firebase Authentication) receives what the provider supplies: always a provider account ID and, depending on the provider and your settings, your email address, name and profile photo. Firebase Authentication may retain these internally as part of your login record. We clear the name and photo from your login profile, never copy any of it into our database, logs or notifications, never show it to other users and never use it to contact you. It is deleted with your login when you delete your account.`,`Vehicles: make, model, colour, size and optional plate.`,`Requests and jobs: service, price, time, the car’s exact location, address and notes, photos of the car (before/after), job status history, ratings and comments.`,`Location: when you choose "Use my location" while booking; for Washers who are online, an approximate position (rounded to about 300 m) so Owners can see roughly where Washers are; during an active job, the Washer’s exact position, shared only with that job’s Owner. Location is used only while the app is open; Faast Wash never tracks location in the background.`,`Messages between an Owner and a Washer about a request, and reports and blocks you make.`,`Washer verification: our provider (Stripe Identity) collects an ID document and selfie to verify identity; we receive the result (verified or not), not copies of your ID.`,`Payments: our provider (Stripe) processes card payments for booking fees; we receive the payment status and amount, not your full card number.`,`Device: push notification token (if you allow notifications), app preferences (such as your navigation app), and basic technical logs for security and troubleshooting (these never include your email address or name).`]},{h:`2. Why we use it`,p:[`To run the marketplace: show requests to nearby Washers, send offers, confirm bookings, share the exact location with the booked Washer, show live arrival, and process booking fees and refunds.`,`To keep people safe: identity verification, chat filtering before booking, reports, blocks and moderation, fraud prevention.`,`To send notifications you asked for (new offers, messages, job updates) and to provide support.`,`We do not sell personal information and we do not use it for third-party advertising.`]},{h:`3. Who we share it with`,p:[`The other party to your booking: Washers see an approximate area before booking and the exact location, address and notes after the booking is confirmed; Owners see the Washer’s display handle, rating and, during the job, live location. Neither side sees the other’s email address or real name.`,`Service providers acting for us: Apple, Google and X (sign-in only, as described above), Google Firebase (authentication, database, file storage, server functions and website hosting), Stripe (payments and identity verification), Expo (push notification delivery in the mobile app), and map tiles from OpenStreetMap and Esri on the website.`,`Some providers store or process data outside Canada, including in the United States (for example our main database is in a US multi-region; server functions and photo storage are in Montréal). Information stored abroad may be accessible to authorities there under local law.`,`Authorities, when required by law or to protect someone’s safety.`]},{h:`4. How long we keep it`,p:[`Your profile, vehicles, open requests and photos, and your login record (including anything Firebase Authentication kept from your sign-in provider), are deleted when you delete your account. Messages you sent are replaced with "[deleted]".`,`Records of completed jobs, ratings and booking-fee payments are kept, without your profile, for disputes and as required by Canadian tax law (generally six years).`]},{h:`5. Your choices and rights`,p:[`You can access and correct your profile in the app, turn notifications off in Settings, deny or revoke location permission in your device settings (you can still type an address), and delete your account in Settings > Delete account.`,`Under PIPEDA you can ask for access to, or correction of, the personal information we hold about you, and withdraw consent (which may mean we can no longer provide the service). Email ${lx}; we respond within 30 days.`,`If you are not satisfied with our answer, you can complain to the Office of the Privacy Commissioner of Canada (priv.gc.ca).`]},{h:`6. Security`,p:[`Data is encrypted in transit; access is limited by role-based rules (for example, only the booked Washer can read a car’s exact location). If a breach creates a real risk of significant harm, we will notify affected people and the Privacy Commissioner as PIPEDA requires.`]},{h:`7. Website storage`,p:[`The website uses your browser’s local storage to keep you signed in and remember preferences (language, map style, navigation app). We do not use advertising or analytics trackers.`]},{h:`8. Children`,p:[`Faast Wash is for people 18 and older. We do not knowingly collect information from minors.`]},{h:`9. Changes`,p:[`We will post updates here and tell you in the app about material changes. Last updated ${fx}.`]}]},safety:{title:`Community & Safety Guidelines`,titleFr:`Règles de la communauté et de sécurité`,intro:`Faast Wash works because Owners and Washers can trust each other. These guidelines apply to everyone; breaking them can lead to removal from Faast Wash.`,sections:[{h:`Everyone`,p:[`Be respectful. No harassment, threats, hate or discrimination of any kind.`,`Keep communication in the app until a booking is confirmed (contact details are blocked in chat before booking).`,`Report anything unsafe or inappropriate with the flag button on a profile, message or job, and block anyone you don’t want to hear from. We aim to review reports within 24 hours.`,`In an emergency, call 911 first.`]},{h:`Owners`,p:[`Describe the car and its location accurately, and make sure it is parked where a wash is allowed (ask your building or lot if unsure).`,`Remove valuables before an interior service and only give access you are comfortable with.`,`Pay the agreed price directly to the Washer when the job is done, and confirm payment in the app.`]},{h:`Washers`,p:[`Complete identity verification and keep your insurance current.`,`Do only the services agreed, use products safe for the vehicle and the surroundings (Faast Wash favours waterless washing), and respect local by-laws and property rules.`,`Never enter a vehicle without the Owner’s permission. Take the before and after photos the app asks for.`,`If you can’t make it, cancel as early as possible. Missing a booking (15 minutes past your arrival estimate without arriving) results in a strike.`]},{h:`Winter`,p:[`Snow and ice services: watch for traffic and ice underfoot, never use hot water on glass, and don’t block driveways or sidewalks with cleared snow.`]},{h:`Enforcement`,p:[`Depending on severity we may warn, remove content, suspend or permanently ban an account, and we cooperate with police when required by law.`]}]}},mx={title:`Support`,titleFr:`Soutien`,intro:`Questions, problems with a booking, or a safety concern? Email ${lx}. We aim to reply within 2 business days (safety reports within 24 hours).`,sections:[{h:`How does payment work?`,p:[`You pay the washer the agreed price directly (cash, e-Transfer or tap). Faast Wash only charges the owner a small booking fee when a booking is confirmed ($2.99, or $4.99 for a full detail; every 10th booking is fee-free).`]},{h:`Can I get the booking fee back?`,p:[`Yes if you cancel before the washer is on the way, if the washer cancels or doesn’t show up, or if a complaint is upheld. See the Terms of Service, section 4.`]},{h:`How do I report someone?`,p:[`Tap the flag on their profile, message or job. You can also block them. For urgent safety issues call 911, then email us.`]},{h:`How do I delete my account?`,p:[`In the app: Settings > Delete account. This deletes your profile, vehicles, open requests and photos. You can also email ${lx} with your display handle (we don’t know your email address).`]},{h:`How do washers get verified?`,p:[`Washers verify their identity with a government ID and a selfie th
