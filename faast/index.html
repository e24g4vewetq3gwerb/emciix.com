e]:[e]}let i=`https://maps.apple.com/?daddr=${r}&dirflg=d`;return n===`ios`?[`maps://?daddr=${r}&dirflg=d`,i]:[i]}var RN=`contact@emciix.com`,zN=`contact@emciix.ca`,BN=`${RN} or ${zN}`,VN=RN,HN=`EMCIIX INC.`,UN=`October 1, 2026`,WN={terms:{title:`Terms of Service`,titleFr:`Conditions d’utilisation`,intro:`These Terms govern your use of the Faast Wash app and website ("Faast Wash"). Faast Wash is operated by ${HN}, a business based in Ontario, Canada ("EMCIIX INC.", "we", "us"). By creating an account or booking a wash you agree to these Terms.`,sections:[{h:`1. What Faast Wash is`,p:[`Faast Wash is a marketplace that connects car owners ("Owners") with independent car washers ("Washers") who come to where the car is parked.`,`EMCIIX INC. is not a car-wash company and does not perform washes. Washers are independent businesses, not employees, agents or contractors of EMCIIX INC. The wash itself is a contract between the Owner and the Washer.`]},{h:`2. Accounts and eligibility`,p:[`You must be at least 18 years old and able to enter a binding contract in Ontario. You sign in with Apple, Google or X: keep that account secure; you are responsible for activity on your Faast Wash account. Other users see you by a generated display handle (for example "Owner 1093").`,`Washers must register (legal name, contact, service area, services), verify their identity with Stripe Identity (a government photo ID and a matching selfie, checked by Stripe) and be approved by the Faast Wash team before they can see requests or send offers, and confirm that they carry insurance appropriate for the work they do.`]},{h:`3. Prices, payment and the booking fee`,p:[`Owners suggest a price; Washers can accept it or counter. The agreed wash price is paid by the Owner directly to the Washer (for example cash, Interac e-Transfer or tap), and Washers keep 100% of it. EMCIIX INC. does not collect or hold the wash price.`,`When an Owner confirms a booking, a booking fee is owed to EMCIIX INC.: currently $2.99 CAD, or $4.99 CAD for a full detail. Every 10th booking is fee-free. Online payment of the booking fee is coming soon; until it launches the fee is only recorded as owed and no card is charged. Washers are never charged a fee by EMCIIX INC.`,`Taxes: the booking fee is a taxable supply. Where EMCIIX INC. is registered for GST/HST, 13% Ontario HST applies to the booking fee and will be shown on your receipt. Washers are responsible for their own income tax and, if they are registrants (for example above the $30,000 small-supplier threshold), for charging and remitting GST/HST on their wash price.`,`When online payment launches, booking fees will be processed by our payment provider (Stripe). Card details will be handled by Stripe and never stored by EMCIIX INC. Customers can add an optional tip after the wash; tips are paid directly to the Washer with the wash price.`]},{h:`4. Cancellations and refunds of the booking fee`,p:[`Owner cancels before the Washer is on the way: booking fee refunded. Owner cancels after the Washer is on the way: no refund.`,`Washer cancels, or does not arrive within 15 minutes of the estimated arrival time: booking fee refunded and the Washer receives a strike.`,`Disputes about the quality of a wash or damage are between the Owner and the Washer; you can report a problem in the app and we will review it, and we may refund the booking fee where a complaint is upheld. Your rights under the Ontario Consumer Protection Act, 2002 are not affected.`]},{h:`5. Your conduct`,p:[`Be honest, respectful and safe. Do not harass, threaten or discriminate against anyone (the Ontario Human Rights Code applies), post illegal or offensive content, misrepresent a vehicle or service, or use Faast Wash for anything other than arranging car washes.`,`Before a booking is confirmed, chat filters block phone numbers, emails, links and social handles so that bookings stay in the app.`,`Washers must only perform the services agreed, use products that are safe for the vehicle and the location, follow local by-laws, and not enter a vehicle without the Owner’s permission.`]},{h:`6. Ratings, reports and moderation`,p:[`Owners and Washers can rate each other after a job. You can report users or content and block people at any time. We review reports and may remove content, suspend or ban accounts that break these Terms or our Community & Safety Guidelines.`]},{h:`7. Location and photos`,p:[`The exact location of a car is shared only with the Washer who is booked for it. Before booking, Washers see an approximate area. While a job is active, the Washer’s live location is shared with that Owner only, and only while the app is open. See the Privacy Policy.`]},{h:`8. Liability`,p:[`Faast Wash is provided "as is". To the extent permitted by law, EMCIIX INC. is not liable for the acts or omissions of Owners or Washers, for damage to vehicles or property, or for indirect or consequential losses. Our total liability to you for any claim is limited to the booking fees you paid in the 12 months before the claim. Nothing in these Terms limits liability that cannot be limited under Ontario law.`]},{h:`9. Ending your account`,p:[`You can delete your account at any time in Settings > Delete account, or by emailing us. We may suspend or close accounts that break these Terms.`]},{h:`10. Changes and governing law`,p:[`We may update these Terms; we will tell you in the app before material changes take effect. These Terms are governed by the laws of Ontario and the federal laws of Canada that apply there, and disputes are heard in the courts of Ontario.`,`Questions: ${BN}.`]}]},privacy:{title:`Privacy Policy`,titleFr:`Politique de confidentialité`,intro:`This policy explains what personal information ${HN} collects through Faast Wash, why, and your choices. We follow the Personal Information Protection and Electronic Documents Act (PIPEDA). Our privacy contact is reachable at ${BN}.`,sections:[{h:`1. What we collect`,p:[`Account: we do not ask for your name or photo. You sign in with your email address (a one-time sign-in link, or a password if you choose one), your mobile phone number (a one-time text code), or with Google (Apple and X when available). Your email address or phone number is used only to sign you in: it is kept in your login record with our authentication service (Google Firebase Authentication), never copied into our database, logs or notifications, never shown to other users, and never used for marketing or to contact you (the only messages are the sign-in link or code you ask for, or a password-reset email you request). Passwords, if you set one, are stored by Firebase Authentication in hashed form; we never see them. Our database keeps a random Faast Wash user ID, a generated display handle (for example "Owner 1093"), your role (Owner/Washer), language and the booking data below. For social sign-in we request the least each provider allows: no name or email scopes from Apple, no extra scopes from Google beyond what sign-in itself requires, and none from X.`,`Phone sign-in: to send the text code, Firebase Authentication uses Google reCAPTCHA to block automated abuse, and an SMS carrier delivers the message. Standard message and data rates may apply.`,`Your sign-in provider (Apple, Google or X) holds your email address and other account details under its own privacy policy. To complete a sign-in, our authentication service (Google Firebase Authentication) receives what the provider supplies: always a provider account ID and, depending on the provider and your settings, your email address, name and profile photo. Firebase Authentication may retain these internally as part of your login record. We clear the name and photo from your login profile, never copy any of it into our database, logs or notifications, never show it to other users and never use it to contact you. It is deleted with your login when you delete your account.`,`Vehicles: make, model, colour, size and optional plate.`,`Requests and jobs: service, price, time, the car’s exact location, address and notes, photos of the car (before/after), job status history, ratings and comments.`,`Location: when you choose "Use my location" while booking; for Washers who are online, an approximate position (rounded to about 300 m) so Owners can see roughly where Washers are; during an active job, the Washer’s exact position, shared only with that job’s Owner. Location is used only while the app is open; Faast Wash never tracks location in the background.`,`Messages between an Owner and a Washer about a request, and reports and blocks you make.`,`Support chat: if you use the live chat on the website, we store your messages, the time of each message, your generated handle, your role (Customer/Washer) and language, so we can answer your request. The chat never asks for your name, email or phone number; please don’t share card numbers, passwords or other sensitive details in it. Support chat is stored in Google Firebase Realtime Database in the United States, and only you and Faast support can read your conversation.`,`Washer registration: legal name, phone or email, service area, services, equipment, vehicle and availability. Your legal name and contact are seen only by the Faast Wash team, never by customers.`,`Washer identity verification: Faast Wash does not collect or store photos of your ID or selfies. Verification is done by Stripe Identity on Stripe’s own page, under Stripe’s privacy policy (stripe.com/privacy); Stripe collects the ID document and selfie. We receive and keep only the result (for example verified or needs another try), the Stripe verification session ID and, if it failed, an error code.`,`Earnings: for each completed booking, a Washer’s earnings record (agreed price, tip, how it was paid, and payout status), and any adjustments or payouts the admin records.`,`Payments: online payment is not live yet; no card details are collected. When it launches, Stripe will process booking-fee payments (and, if enabled, Washer payouts via Stripe Connect); we will receive the payment status and amount, not your full card number.`,`Device: push notification token (if you allow notifications), app preferences (such as your navigation app), and basic technical logs for security and troubleshooting (these never include your email address or name).`]},{h:`2. Why we use it`,p:[`To run the marketplace: show requests to nearby Washers, send offers, confirm bookings, share the exact location with the booked Washer, show live arrival, and process booking fees and refunds.`,`To keep people safe: identity verification, chat filtering before booking, reports, blocks and moderation, fraud prevention.`,`To send notifications you asked for (new offers, messages, job updates) and to provide support.`,`We do not sell personal information and we do not use it for third-party advertising.`]},{h:`3. Who we share it with`,p:[`The other party to your booking: Washers see an approximate area before booking and the exact location, address and notes after the booking is confirmed; Owners see the Washer’s display handle, rating and, during the job, live location. Neither side sees the other’s email address or real name.`,`Service providers acting for us: Apple, Google and X (sign-in only, as described above), Google Firebase (authentication, including sending sign-in emails and text codes, and reCAPTCHA; database, file storage, server functions and website hosting), Stripe (payments, once online payment launches, and washer identity verification with Stripe Identity), Expo (push notification delivery in the mobile app), and map tiles from OpenStreetMap and Esri on the website.`,`Some providers store or process data outside Canada, including in the United States (for example our main database is in a US multi-region; server functions and photo storage are in Montréal). Information stored abroad may be accessible to authorities there under local law.`,`Authorities, when required by law or to protect someone’s safety.`]},{h:`4. How long we keep it`,p:[`Your profile, vehicles, open requests and photos, and your login record (your sign-in email address or phone number, and anything Firebase Authentication kept from your sign-in provider), are deleted when you delete your account. Messages you sent are replaced with "[deleted]".`,`Records of completed jobs, ratings, booking fees and Washer earnings and payouts are kept, without your profile, for disputes and as required by Canadian tax law (generally six years).`,`We keep no ID photos. Stripe keeps verification data according to its own retention policy; you can ask Stripe to delete it.`,`Support chat conversations are kept while we need them to answer and follow up on your request. To have yours deleted, email ${BN}.`]},{h:`5. Your choices and rights`,p:[`You can access and correct your profile in the app, turn notifications off in Settings, deny or revoke location permission in your device settings (you can still type an address), and delete your account in Settings > Delete account.`,`Under PIPEDA you can ask for access to, or correction of, the personal information we hold about you, and withdraw consent (which may mean we can no longer provide the service). Email ${BN}; we respond within 30 days.`,`If you are not satisfied with our answer, you can complain to the Office of the Privacy Commissioner of Canada (priv.gc.ca).`]},{h:`6. Security`,p:[`Data is encrypted in transit; access is limited by role-based rules (for example, only the booked Washer can read a car’s exact location). If a breach creates a real risk of significant harm, we will notify affected people and the Privacy Commissioner as PIPEDA requires.`]},{h:`7. Website storage`,p:[`The website uses your browser’s local storage to keep you signed in and remember preferences (language, map style, navigation app). We do not use advertising or analytics trackers.`]},{h:`8. Children`,p:[`Faast Wash is for people 18 and older. We do not knowingly collect information from minors.`]},{h:`9. Changes`,p:[`We will post updates here and tell you in the app about material changes. Last updated ${UN}.`]}]},safety:{title:`Community & Safety Guidelines`,titleFr:`Règles de la communauté et de sécurité`,intro:`Faast Wash works because Owners and Washers can trust each other. These guidelines apply to everyone; breaking them can lead to removal from Faast Wash.`,sections:[{h:`Everyone`,p:[`Be respectful. No harassment, threats, hate or discrimination of any kind.`,`Keep communication in the app until a booking is confirmed (contact details are blocked in chat before booking).`,`Report anything unsafe or inappropriate with the flag button on a profile, message or job, and block anyone you don’t want to hear from. We aim to review reports within 24 hours.`,`In an emergency, call 911 first.`]},{h:`Owners`,p:[`Describe the car and its location accurately, and make sure it is parked where a wash is allowed (ask your building or lot if unsure).`,`Remove valuables before an interior service and only give access you are comfortable with.`,`Pay the agreed price directly to the Washer when the job is done, and confirm payment in the app.`]},{h:`Washers`,p:[`Complete identity verification and keep your insurance current.`,`Do only the services agreed, use products safe for the vehicle and the surroundings (Faast Wash favours waterless washing), and respect local by-laws and property rules.`,`Never enter a vehicle without the Owner’s permission. Take the before and after photos the app asks for.`,`If you can’t make it, cancel as early as possible. Missing a booking (15 minutes past your arrival estimate without arriving) results in a strike.`]},{h:`Winter`,p:[`Snow and ice services: watch for traffic and ice underfoot, never use hot water on glass, and don’t block driveways or sidewalks with cleared snow.`]},{h:`Enforcement`,p:[`Depending on severity we may warn, remove content, suspend or permanently ban an account, and we cooperate with police when required by law.`]}]}},GN={title:`Support`,titleFr:`Soutien`,intro:`Questions, problems with a booking, or a safety concern? Email ${BN}. We aim to reply within 2 business days (safety reports within 24 hours).`,sections:[{h:`How does payment work?`,p:[`You pay the washer the agreed price directly (cash, e-Transfer or tap). Faast Wash only charges the owner a small booking fee when a booking is confirmed ($2.99, or $4.99 for a full detail; every 10th booking is fee-free).`]},{h:`Can I get the booking fee back?`,p:[`Yes if you cancel before the washer is on the way, if the washer cancels or doesn’t show up, or if a complaint is upheld. See the Terms of Service, section 4.`]},{h:`How do I report someone?`,p:[`Tap the flag on their profile, message or job. You can also block them. For urgent safety issues call 911, then email us.`]},{h:`How do I delete my account?`,p:[`In the app: Settings > Delete account. This deletes your profile, vehicles, open requests and photos. You can also email ${BN} from the email address you sign in with, or include your display handle.`]},{h:`How do washers get verified?`,p:[`Washers apply in the Washer tab (Become a washer), then verify their identity with Stripe Identity (government photo ID and a selfie, on Stripe’s secure page; this is launching soon). The Faast Wash team then approves or rejects with a reason. Only approved washers can see requests and send offers. Faast Wash never collects or stores ID photos.`]}]};function KN(){let e=[];return{add(t){return e.push(t),t},dispose(){e.splice(0).forEach(e=>{try{e()}catch{}})}}}var qN=()=>`mailto:${VN}?subject=${encodeURIComponent(V(`waitlistSubject`))}`;function JN(){return K(`div`,{class:`card launch`,role:`status`},K(`div`,{class:`row top`},J(`schedule`,22),K(`h3`,{class:`grow`,text:V(`launchTitle`)})),K(`p`,{class:`muted`,text:V(`launchBody`)}),K(`a`,{class:`btn btn-primary`,href:qN()},J(`mail`,20),K(`span`,{text:V(`joinWaitlist`)})))}function YN(){return K
