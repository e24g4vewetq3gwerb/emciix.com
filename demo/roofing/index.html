    "url": B.url,
    "telephone": B.phoneTel,
    "email": B.email,
    "priceRange": B.priceRange,
    "foundingDate": B.founded,
    "address": { "@type": "PostalAddress", "streetAddress": B.street, "addressLocality": B.city, "addressRegion": B.region, "postalCode": B.postal, "addressCountry": B.country },
    "areaServed": S.serviceAreas.map(function (a) { return { "@type": "Place", "name": a + ", " + B.region }; }),
    "openingHoursSpecification": S.hoursSchema.map(function (h) { return { "@type": "OpeningHoursSpecification", "dayOfWeek": h.days, "opens": h.opens, "closes": h.closes }; }),
    "hasOfferCatalog": { "@type": "OfferCatalog", "name": "Services", "itemListElement": S.services.map(function (v) { return { "@type": "Offer", "itemOffered": { "@type": "Service", "name": v.name, "description": v.text }, "description": v.price }; }) }
  };
  var tag = document.createElement("script");
  tag.type = "application/ld+json";
  tag.id = "business-jsonld";
  tag.textContent = JSON.stringify(ld);
  document.head.appendChild(tag);

  // ---------- visitor location pill: shows the visitor's area, falls back to the config city ----------
  // Visitor location (privacy-first): one call per browser session to our own Vercel endpoint,
  // which reads only Vercel's coarse geo headers and returns {local:true|false, label:"City, ON"|null}.
  // Nothing is logged or stored server-side; the answer is cached in sessionStorage (emciix.geo + emciix.local).
  // Test overrides: ?city=Some%20City (pill label), ?local=ssm / ?local=off (local copy).
  function geoLookup(apply) {
    var q = location.search, forced = /[?&]local=(ssm|off)(?:&|$)/.test(q), city = null, cached = null;
    var m = q.match(/[?&]city=([^&#]*)/);
    if (m) { try { city = decodeURIComponent(m[1].replace(/\+/g, " ")).replace(/\s+/g, " ").trim().slice(0, 48) || null; } catch (e) {} }
    try { cached = JSON.parse(sessionStorage.getItem("emciix.geo") || "null"); } catch (e) {}
    function done(d) {
      apply({ local: !forced && d ? d.local === true : null, label: city || (d && typeof d.label === "string" && d.label ? d.label : null) });
    }
    if (city || cached || !/(^|\.)emciix\.(com|ca)$/.test(location.hostname) || !window.fetch) { done(cached); return; }
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 3000);
    fetch("https://emciix-yt-views.vercel.app/geo", { cache: "no-store", credentials: "omit", signal: ctl ? ctl.signal : undefined })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (d) {
        clearTimeout(timer);
        if (!d || typeof d.local !== "boolean") { done(null); return; }
        var keep = { local: d.local, label: typeof d.label === "string" ? d.label.slice(0, 64) : null };
        try { sessionStorage.setItem("emciix.geo", JSON.stringify(keep)); sessionStorage.setItem("emciix.local", d.local ? "1" : "0"); } catch (e) {}
        done(keep);
      })
      .catch(function () { clearTimeout(timer); done(null); });
  }
  geoLookup(function (g) {
    var pill = document.getElementById("loc-pill");
    if (!pill || !g.label) return;
    pill.querySelector(".loc-text").textContent = g.label;
    pill.setAttribute("title", g.label + " & area");
  });
})();
</script>
</body>
</html>
