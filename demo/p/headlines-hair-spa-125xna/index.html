  html += '<footer class="site-foot"><div class="wrap"><div class="foot-grid">' +
    '<div>' + logo() + '<p style="margin:12px 0 0">' + esc(B.tagline) + '</p></div>' +
    '<div><h2>' + esc(B.visitTitle) + '</h2><ul><li>' + esc(B.street) + '</li><li>' + esc(B.city + ", " + B.region + " " + B.postal) + '</li><li><a href="' + mapUrl() + '" target="_blank" rel="noopener noreferrer">Map</a></li></ul></div>' +
    '<div><h2>Preview contact</h2><ul><li>' + esc(N.name) + '</li><li><a href="' + tel() + '">' + esc(N.phoneDisplay) + '</a></li><li><a href="mailto:' + esc(N.email) + '">' + esc(N.email) + '</a></li></ul></div>' +
    '</div><p class="disclaimer">' + esc(D.disclaimer) + '</p>' +
    '<div class="foot-base"><span>Preview for ' + esc(B.name) + '</span><span><a href="/hire">Website by Need</a></span></div></div></footer>';

  html += '<div class="callbar"><a class="btn btn-accent" href="' + tel() + '">' + I.phone + 'Call now</a><a class="btn btn-primary" href="#request">' + esc(S.request.short) + '</a></div>';
  document.getElementById("app").innerHTML = html;

  var form = document.getElementById("req-form");
  document.querySelectorAll("a[data-service]").forEach(function (a) {
    a.addEventListener("click", function () { var sel = document.getElementById("q-service"); if (sel) sel.value = a.getAttribute("data-service"); });
  });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = form.elements;
    if (!f.name.value.trim()) { f.name.focus(); f.name.setAttribute("aria-invalid", "true"); return; }
    var lines = ["Hi,", "", "(Sent from the " + B.name + " website preview built by Need.)", "",
      "Name: " + f.name.value.trim(), "Phone: " + (f.phone.value.trim() || "-"), Q.serviceLabel + ": " + f.service.value];
    if (f.when) lines.push("Preferred time: " + (f.when.value.trim() || "-"));
    if (f.address) lines.push("Address: " + (f.address.value.trim() || "-"));
    lines.push("", "Details:", f.details.value.trim() || "-", "", "Thanks!");
    window.location.href = "mailto:" + N.email + "?subject=" + encodeURIComponent(Q.subject + ": " + f.service.value) + "&body=" + encodeURIComponent(lines.join("\n"));
  });
})();
</script>
</body>
</html>
