<script>
(function () {
  var planet = document.getElementById("warp-planet");
  var drag = null;
  var moved = false;
  function placePlanet(x, y) {
    window.__planetX = x;
    window.__planetY = y;
  }
  try {
    var saved = JSON.parse(localStorage.getItem("starslip-planet") || "null");
    if (saved && typeof saved.x === "number" && typeof saved.y === "number") placePlanet(saved.x, saved.y);
  } catch (e) {}
  planet.addEventListener("pointerdown", function (event) {
    event.stopPropagation();
    event.preventDefault();
    moved = false;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
    planet.style.cursor = "grabbing";
    try { planet.setPointerCapture(event.pointerId); } catch (err) {}
  });
  planet.addEventListener("pointermove", function (event) {
    event.stopPropagation();
    if (!drag || event.pointerId !== drag.id) return;
    if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 4) moved = true;
    var w = window.innerWidth || 1;
    var h = window.innerHeight || 1;
    placePlanet(Math.min(0.94, Math.max(0.06, event.clientX / w)), Math.min(0.94, Math.max(0.06, event.clientY / h)));
  });
  function endDrag(event) {
    if (!drag || event.pointerId !== drag.id) return;
    drag = null;
    planet.style.cursor = "grab";
    if (!moved) {
      window.location.href = planet.getAttribute("href");
      return;
    }
    event.preventDefault();
    event.stopPropagation();
    try { localStorage.setItem("starslip-planet", JSON.stringify({ x: window.__planetX, y: window.__planetY })); } catch (err) {}
  }
  planet.addEventListener("pointerup", endDrag);
  planet.addEventListener("pointercancel", endDrag);
  planet.addEventListener("click", function (event) {
    if (!moved) return;
    event.preventDefault();
    event.stopPropagation();
    moved = false;
  });
  var call = document.getElementById("galacticCall");
  if (call) {
    var callDrag = null;
    var callMoved = false;
    function placeCall(x, y) {
      call.style.left = (x * 100) + "%";
      call.style.top = (y * 100) + "%";
      call.style.transform = "translate(-50%, -50%)";
    }
    try {
      var savedCall = JSON.parse(localStorage.getItem("starslip-input") || "null");
      if (savedCall && typeof savedCall.x === "number" && typeof savedCall.y === "number") placeCall(savedCall.x, savedCall.y);
    } catch (e) {}
    call.addEventListener("pointerdown", function (event) {
      event.stopPropagation();
      var rect = call.getBoundingClientRect();
      callMoved = false;
      callDrag = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        ox: event.clientX - (rect.left + rect.width / 2),
        oy: event.clientY - (rect.top + rect.height / 2)
      };
      try { call.setPointerCapture(event.pointerId); } catch (err) {}
    });
    call.addEventListener("pointermove", function (event) {
      event.stopPropagation();
      if (!callDrag || event.pointerId !== callDrag.id) return;
      if (Math.hypot(event.clientX - callDrag.x, event.clientY - callDrag.y) > 6) {
        if (!callMoved) {
          callMoved = true;
          call.classList.add("is-dragging");
          if (document.activeElement && call.contains(document.activeElement)) document.activeElement.blur();
        }
        event.preventDefault();
      }
      if (!callMoved) return;
      var w = window.innerWidth || 1;
      var h = window.innerHeight || 1;
      placeCall(Math.min(0.9, Math.max(0.1, (event.clientX - callDrag.ox) / w)), Math.min(0.9, Math.max(0.1, (event.clientY - callDrag.oy) / h)));
    });
    function endCallDrag(event) {
      if (!callDrag || event.pointerId !== callDrag.id) return;
      callDrag = null;
      call.classList.remove("is-dragging");
      if (!callMoved) return;
      event.preventDefault();
      event.stopPropagation();
      var left = parseFloat(call.style.left);
      var top = parseFloat(call.style.top);
      try { localStorage.setItem("starslip-input", JSON.stringify({ x: left / 100, y: top / 100 })); } catch (err) {}
    }
    call.addEventListener("pointerup", endCallDrag);
    call.addEventListener("pointercancel", endCallDrag);
    call.addEventListener("click", function (event) {
      if (!callMoved) return;
      event.preventDefault();
      event.stopPropagation();
      callMoved = false;
    });
  }
})();
