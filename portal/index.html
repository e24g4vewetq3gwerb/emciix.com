<meta charset="UTF-8" />

  <style>
    #warp-planet {
      position: fixed;
      z-index: 20;
      left: 0;
      top: 0;
      width: 128px;
      height: 128px;
      margin: -64px 0 0 -64px;
      border-radius: 50%;
      text-decoration: none;
      touch-action: manipulation;

      top: 0;

      height: 22px;
      margin: -11px 0 0 -11px;
      border-radius: 50%;
      pointer-events: none;
      visibility: hidden;
      background: radial-gradient(circle at 32% 30%, #f7f3ea, #b7aa96 42%, #3a342c 78%);

<div id="root"></div>
<a id="warp-planet" data-hud href="https://emciix.com/game/play" aria-label="Open the game"></a>
<span id="warp-moon" aria-hidden="true"></span>
<script>
(function () {
  var planet = document.getElementById("warp-planet");
  planet.addEventListener("pointerdown", function (event) { event.stopPropagation(); });
  planet.addEventListener("pointermove", function (event) { event.stopPropagation(); });
})();
</script>
