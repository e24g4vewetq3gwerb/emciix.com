<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>portal</title>
<meta name="description" content="A warp-speed starfield you can steer." />
<link rel="icon" href="/portal/assets/favicon-portal.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/portal/assets/index-DLVCRiHz.js"></script>
  <link rel="stylesheet" crossorigin href="/portal/assets/index-C17i1khB.css">
  <style>
    #warp-planet {
      position: fixed;
      z-index: 20;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      text-decoration: none;
      touch-action: manipulation;
      visibility: hidden;
      background: url("/portal/assets/planet.png") center / cover no-repeat;
      pointer-events: auto;
    }
  </style>
</head>
<body>
<div id="root"></div>
<a id="warp-planet" data-hud href="https://emciix.com/game/play" aria-label="Open the game"></a>
<script>
(function () {
  var planet = document.getElementById("warp-planet");
  function tick() {
    var p = window.__warp;
    if (!p || !p.z || p.x < -0.08 || p.x > 1.08 || p.y < -0.08 || p.y > 1.08) {
      planet.style.visibility = "hidden";
    } else {
      var d = p.r;
      planet.style.visibility = "visible";
      planet.style.width = d + "px";
      planet.style.height = d + "px";
      planet.style.left = (p.x * p.w - d / 2) + "px";
      planet.style.top = (p.y * p.h - d / 2) + "px";
    }
    requestAnimationFrame(tick);
  }
  planet.addEventListener("pointerdown", function (event) { event.stopPropagation(); });
  planet.addEventListener("pointermove", function (event) { event.stopPropagation(); });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
