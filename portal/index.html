<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Starslip</title>
<meta name="description" content="A warp-speed starfield you can steer." />
<link rel="icon" href="/portal/assets/favicon-CozO3afC.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/portal/assets/index-DLVCRiHz.js"></script>
  <link rel="stylesheet" crossorigin href="/portal/assets/index-C17i1khB.css">
  <style>
    #warp-planet {
      position: fixed;
      z-index: 40;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      text-decoration: none;
      touch-action: manipulation;
      background:
        radial-gradient(circle at 32% 28%, #e9fdff 0 8%, transparent 9%),
        radial-gradient(circle at 70% 64%, rgba(0, 0, 0, 0.35) 0 14%, transparent 15%),
        radial-gradient(circle at 40% 42%, #7ef6ff, #1a4e86 48%, #070b16 74%);
      box-shadow:
        0 0 0 8px rgba(62, 240, 255, 0.12),
        0 0 28px rgba(62, 240, 255, 0.55),
        inset -14px -10px 18px rgba(0, 0, 0, 0.5);
    }
    #warp-planet::before {
      content: "";
      position: absolute;
      left: -18px;
      right: -18px;
      top: 34px;
      height: 14px;
      border: 2px solid rgba(255, 225, 74, 0.9);
      border-radius: 50%;
      transform: rotate(-18deg);
      box-shadow: 0 0 12px rgba(255, 225, 74, 0.45);
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="root"></div>
<a id="warp-planet" data-hud href="https://emciix.com/game/play" aria-label="Open the game"></a>
<script>
(function () {
  var planet = document.getElementById("warp-planet");
  var size = 84;
  var pad = 18;
  function place() {
    var maxX = Math.max(pad, window.innerWidth - size - pad);
    var maxY = Math.max(pad, window.innerHeight - size - pad);
    planet.style.left = (pad + Math.random() * (maxX - pad)) + "px";
    planet.style.top = (pad + Math.random() * (maxY - pad)) + "px";
  }
  place();
  planet.addEventListener("pointerdown", function (event) {
    event.stopPropagation();
  });
})();
</script>
</body>
</html>
