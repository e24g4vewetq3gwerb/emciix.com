<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Starslip</title>
<meta name="description" content="A warp-speed starfield you can steer." />
<link rel="icon" href="/portal/assets/favicon-CozO3afC.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/portal/assets/index-DLVCRiHz.js"></script>
  <link rel="stylesheet" crossorigin href="/portal/assets/index-C17i1khB.css">
  <style>
    #warp-planet {
      position: fixed;
      z-index: 40;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      text-decoration: none;
      touch-action: manipulation;
      background: url("/portal/assets/planet.png") center / cover no-repeat;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 16px rgba(120, 190, 220, 0.28));
      transition: transform 0.15s ease;
    }
    #warp-planet:hover,
    #warp-planet:focus-visible {
      transform: scale(1.06);
    }
    #warp-planet:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
<div id="root"></div>
<a id="warp-planet" data-hud href="https://emciix.com/game/play" aria-label="Open the game"></a>
<script>
(function () {
  var planet = document.getElementById("warp-planet");
  var size = 120;
  var pad = 18;
  function place() {
    var maxX = Math.max(pad, window.innerWidth - size - pad);
    var maxY = Math.max(pad, window.innerHeight - size - pad);
    planet.style.left = (pad + Math.random() * (maxX - pad)) + "px";
    planet.style.top = (pad + Math.random() * (maxY - pad)) + "px";
  }
  place();
  planet.addEventListener("pointerdown", function (event) {
    event.stopPropagation();
  });
})();
</script>
</body>
</html>
