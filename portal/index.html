  <style>

      border: 1px solid rgba(255,255,255,.28); background: transparent; color: #f5f5f7; border-radius: 12px; cursor: pointer;
    }

    #add-planet { width: 100%; padding: 9px 12px; }
    html.portal-embed #local-settings,

<body>
<div id="root"></div>
<form class="portal-call" id="galacticCall">
  <input class="caller-profile" id="callerProfile" name="caller" type="text" placeholder="" autocomplete="off" maxlength="180" required />
  <button type="submit" class="call-send" id="callerSend" aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 11h11.2l-4.3-4.3 1.4-1.4L19.6 12l-7.3 6.7-1.4-1.4 4.3-4.3H4z"/></svg></button>
</form>
<span id="embed-fly">Fly</span>
<span id="warp-atmo" aria-hidden="true"></span>
<div id="planet-layer"></div>
<button type="button" id="local-settings-btn" aria-expanded="false">Local</button>
<aside id="local-settings" hidden>
  <h2>Local</h2>
  <p>Planets stay on this device. Choose a link for each one.</p>
  <div id="planet-list"></div>
  <button type="button" id="add-planet">Add planet</button>
</aside>
<script>
// Game background mode (/portal/?bg=1 inside /game/play): starfield only.
// Drop the planet, its ring, the moon and the call pill so nothing is drawn or fetched
// (planet.webp, call ledger, avatars); the warp renderer skips missing nodes.
(function () {
  if (!document.documentElement.classList.contains("portal-bg")) return;
  ["warp-planet", "warp-atmo", "warp-moon", "galacticCall", "embed-fly", "planet-layer", "local-settings", "local-settings-btn"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el && el.parentNode) el.parentNode.removeChild(el);
  });
})();
</script>
<script>
(function () {
  var KEY = "portal-planets-local";
  var layer = document.getElementById("planet-layer");
  var listEl = document.getElementById("planet-list");
  var panel = document.getElementById("local-settings");
  var toggle = document.getElementById("local-settings-btn");
  var addBtn = document.getElementById("add-planet");
  var planets = [];
  var drag = null;
  function cleanHref(value) {
    var v = String(value || "").trim();
    if (!v) return "";
    if (v.charAt(0) === "/" && v.charAt(1) !== "/") return v;
    if (!/^https?:\/\//i.test(v)) v = "https://" + v.replace(/^\/+/, "");
    try {
      var url = new URL(v, location.origin);
      if (url.protocol === "http:" || url.protocol === "https:") return url.href;
    } catch (err) {}
    return "";
  }
  function clamp(n) { return Math.min(0.94, Math.max(0.06, n)); }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(planets)); } catch (err) {}
  }
  function load() {
    try {
      var list = JSON.parse(localStorage.getItem(KEY) || "null");
      if (Array.isArray(list) && list.length) {
        return list.filter(function (p) {
          return p && typeof p.x === "number" && typeof p.y === "number";
        }).slice(0, 12).map(function (p, i) {
          return { id: String(p.id || ("p" + i)), x: clamp(p.x), y: clamp(p.y), href: cleanHref(p.href) };
        });
      }
    } catch (err) {}
    var x = 0.2, y = 0.18;
    try {
      var old = JSON.parse(localStorage.getItem("starslip-planet") || "null");
      if (old && typeof old.x === "number" && typeof old.y === "number") { x = old.x; y = old.y; }
    } catch (err) {}
    return [{ id: "p1", x: clamp(x), y: clamp(y), href: "https://emciix.com/game/play" }];
  }
  function spot() {
    var spots = [[0.78, 0.22], [0.22, 0.78], [0.8, 0.74], [0.5, 0.16], [0.5, 0.84], [0.14, 0.5], [0.86, 0.5]];
    for (var i = 0; i < spots.length; i++) {
      var free = planets.every(function (p) { return Math.hypot(p.x - spots[i][0], p.y - spots[i][1]) > 0.14; });
      if (free) return { x: spots[i][0], y: spots[i][1] };
    }
    return { x: clamp(0.2 + Math.random() * 0.6), y: clamp(0.2 + Math.random() * 0.6) };
  }
  function paint() {
    var w = window.innerWidth || 1;
    var h = window.innerHeight || 1;
    for (var i = 0; i < planets.length; i++) {
      var el = document.getElementById("planet-" + planets[i].id);
      if (!el) continue;
      el.style.visibility = "visible";
      el.style.transform = "translate3d(" + (planets[i].x * w).toFixed(2) + "px," + (planets[i].y * h).toFixed(2) + "px,0) scale(0.4063)";
    }
    requestAnimationFrame(paint);
  }
  function drawList() {
    if (!listEl) return;
    listEl.replaceChildren();
    planets.forEach(function (planet, index) {
      var row = document.createElement("div");
      row.className = "planet-row";
      var input = document.createElement("input");
      input.type = "url";
      input.placeholder = "https://";
      input.value = planet.href;
      input.setAttribute("aria-label", "Planet " + (index + 1) + " link");
      input.addEventListener("input", function () {
        planet.href = cleanHref(input.value);
        var node = document.getElementById("planet-" + planet.id);
        if (node) node.setAttribute("href", planet.href || "#");
        save();
      });
      input.addEventListener("change", function () { input.value = planet.href; });
      var remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.setAttribute("aria-label", "Remove planet");
      remove.addEventListener("click", function () {
        planets = planets.filter(function (item) { return item.id !== planet.id; });
        save();
        drawPlanets();
        drawList();
      });
      row.appendChild(input);
      row.appendChild(remove);
      listEl.appendChild(row);
    });
  }
  function drawPlanets() {
    if (!layer) return;
    layer.replaceChildren();
    planets.forEach(function (planet, index) {
      var el = document.createElement("a");
      el.className = "warp-planet";
      el.id = "planet-" + planet.id;
      el.href = planet.href || "#";
      el.style.filter = "hue-rotate(" + (index * 46) + "deg)";
      el.setAttribute("aria-label", planet.href ? "Open link" : "Set a link in Local");
      el.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        event.preventDefault();
        drag = { id: event.pointerId, planet: planet, x: event.clientX, y: event.clientY, moved: false };
        el.style.cursor = "grabbing";
        try { el.setPointerCapture(event.pointerId); } catch (err) {}
      });
      el.addEventListener("pointermove", function (event) {
        event.stopPropagation();
        if (!drag || drag.id !== event.pointerId || drag.planet !== planet) return;
        if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 4) drag.moved = true;
        var w = window.innerWidth || 1;
        var h = window.innerHeight || 1;
        planet.x = clamp(event.clientX / w);
        planet.y = clamp(event.clientY / h);
      });
      function endDrag(event) {
        if (!drag || drag.id !== event.pointerId || drag.planet !== planet) return;
        var moved = drag.moved;
        drag = null;
        el.style.cursor = "grab";
        if (!moved) {
          if (planet.href) window.location.href = planet.href;
          else if (panel && toggle) { panel.hidden = false; toggle.setAttribute("aria-expanded", "true"); }
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        save();
      }
      el.addEventListener("pointerup", endDrag);
      el.addEventListener("pointercancel", endDrag);
      el.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
      });
      layer.appendChild(el);
    });
  }
  if (!document.documentElement.classList.contains("portal-bg") && layer) {
    planets = load();
    save();
    drawPlanets();
    drawList();
    requestAnimationFrame(paint);
    if (toggle && panel) toggle.addEventListener("click", function () {
      panel.hidden = !panel.hidden;
      toggle.setAttribute("aria-expanded", panel.hidden ? "false" : "true");
    });
    if (addBtn) addBtn.addEventListener("click", function () {
      if (planets.length >= 12) return;
      var next = spot();
      planets.push({ id: "p" + Date.now().toString(36), x: next.x, y: next.y, href: "" });
      save();
      drawPlanets();
      drawList();
      if (panel && toggle) { panel.hidden = false; toggle.setAttribute("aria-expanded", "true"); }
      var fields = listEl.querySelectorAll("input");
      if (fields.length) fields[fields.length - 1].focus();
    });
  }

  var call = document.getElementById("galacticCall");
  if (call) {
    var callDrag = null;
    var callMoved = false;
    function placeCall(x, y) {
      call.style.left = (x * 100) + "%";
      call.style.top = (y * 100) + "%";
      call.style.transform = "translate(-50%, -50%)";
    }
    try {
      var savedCall = JSON.parse(localStorage.getItem("starslip-input") || "null");
      if (savedCall && typeof savedCall.x === "number" && typeof savedCall.y === "number") placeCall(savedCall.x, savedCall.y);
    } catch (e) {}
    call.addEventListener("pointerdown", function (event) {
      event.stopPropagation();
      var rect = call.getBoundingClientRect();
      callMoved = false;
      callDrag = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        ox: event.clientX - (rect.left + rect.width / 2),
        oy: event.clientY - (rect.top + rect.height / 2)
      };
      try { call.setPointerCapture(event.pointerId); } catch (err) {}
    });
    call.addEventListener("pointermove", function (event) {
      event.stopPropagation();
      if (!callDrag || event.pointerId !== callDrag.id) return;
      if (Math.hypot(event.clientX - callDrag.x, event.clientY - callDrag.y) > 6) {
        if (!callMoved) {
          callMoved = true;
          call.classList.add("is-dragging");
          if (document.activeElement && call.contains(document.activeElement)) document.activeElement.blur();
        }
        event.preventDefault();
      }
      if (!callMoved) return;
      var w = window.innerWidth || 1;
      var h = window.innerHeight || 1;
      placeCall(Math.min(0.9, Math.max(0.1, (event.clientX - callDrag.ox) / w)), Math.min(0.9, Math.max(0.1, (event.clientY - callDrag.oy) / h)));
    });
    function endCallDrag(event) {
      if (!callDrag || event.pointerId !== callDrag.id) return;
      callDrag = null;
      call.classList.remove("is-dragging");
      if (!callMoved) return;
      event.preventDefault();
      event.stopPropagation();
      var left = parseFloat(call.style.left);
      var top = parseFloat(call.style.top);
      try { localStorage.setItem("starslip-input", JSON.stringify({ x: left / 100, y: top / 100 })); } catch (err) {}
    }
    call.addEventListener("pointerup", endCallDrag);
    call.addEventListener("pointercancel", endCallDrag);
    call.addEventListener("click", function (event) {
      if (!callMoved) return;
      event.preventDefault();
      event.stopPropagation();
      callMoved = false;
    });
  }
})();
</script>
<script src="/portal/galactic-call.js?v=text-1" defer></script>
</body>
