<!DOCTYPE html>
<html lang="en">
  <head>
  <script>(function(){try{var t=localStorage.getItem("emciix.theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}else{var light=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches;document.documentElement.setAttribute("data-theme",light?"light":"dark");}}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04040C" />
    <meta name="description" content="Need a song, a line in your town, or a better price. Start anywhere." />
    <title>Need</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./need-logo.png" />
    <script type="module" crossorigin src="/need/assets/index-Bsi7rUKP.js?v=doors-8"></script>
    <link rel="stylesheet" crossorigin href="/need/assets/index-pQCypl1A.css">
      <link rel="stylesheet" href="/need/wide.css?v=wide-10">
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        function mount() {
          var top = document.querySelector(".need-home-top");
          if (!top || document.getElementById("needHomeBack")) return;
          var link = document.createElement("a");
          link.id = "needHomeBack";
          link.className = "need-home-back";
          link.href = "https://emciix.com";
          link.textContent = "Home";
          top.insertBefore(link, top.firstChild);
        }
        mount();
        new MutationObserver(mount).observe(document.body, { childList: true, subtree: true });
      })();
      (function () {
        var keys = ["sleeve", "beam", "room", "hold"];
        function on(key) {
          try { return sessionStorage.getItem("need-up-" + key) === "1"; } catch (e) { return false; }
        }
        function paint() {
          var label = null;
          var nodes = document.querySelectorAll("p");
          for (var i = 0; i < nodes.length; i++) {
            if ((nodes[i].textContent || "").trim() === "Now playing") label = nodes[i];
          }
          if (!label) return;
          var card = label.nextElementSibling;
          if (!card) return;
          label.classList.add("need-now-label");
          card.classList.add("need-now-card");
          var buttons = card.querySelectorAll("button");
          for (var b = 0; b < buttons.length; b++) {
            var text = (buttons[b].textContent || "").trim();
            if (text === "Skip" || text === "…") buttons[b].classList.add("need-skip");
            if (text === "Keep") buttons[b].classList.add("need-keep");
          }
          var tracks = card.querySelectorAll('div[aria-hidden="true"]');
          for (var t = 0; t < tracks.length; t++) {
            var fill = tracks[t].firstElementChild;
            if (fill && fill.style && /%$/.test(fill.style.width)) tracks[t].classList.add("need-beam-track");
          }
          if (!card.querySelector("#needUpgrades")) {
            var bar = document.createElement("div");
            bar.id = "needUpgrades";
            bar.className = "need-upgrades";
            bar.innerHTML = '<span class="need-up-kicker">Imaginary upgrades</span>';
            keys.forEach(function (key) {
              var button = document.createElement("button");
              button.type = "button";
              button.setAttribute("data-up", key);
              button.textContent = key.charAt(0).toUpperCase() + key.slice(1);
              bar.appendChild(button);
            });
            card.appendChild(bar);
            bar.addEventListener("click", function (e) {
              var hit = e.target.closest("button[data-up]");
              if (!hit) return;
              var key = hit.getAttribute("data-up");
              var next = !card.classList.contains("is-" + key);
              card.classList.toggle("is-" + key, next);
              hit.classList.toggle("on", next);
              try { sessionStorage.setItem("need-up-" + key, next ? "1" : "0"); } catch (err) {}
            });
          }
          keys.forEach(function (key) {
            var active = on(key);
            card.classList.toggle("is-" + key, active);
            var hit = card.querySelector('[data-up="' + key + '"]');
            if (hit) hit.classList.toggle("on", active);
          });
        }
        paint();
        new MutationObserver(paint).observe(document.body, { childList: true, subtree: true });
      })();
      (function () {
        function shelf() {
          var shop = document.querySelector(".need-door-preview--shop");
          if (!shop || shop.getAttribute("data-shelf") === "1") return;
          shop.setAttribute("data-shelf", "1");
          shop.innerHTML =
            '<span class="need-shelf-kicker">Two stores</span>' +
            '<ul class="need-pv-prices need-shelf">' +
            '<li class="need-pv-price"><span class="need-pv-price-name">Scan a shelf</span><span class="need-pv-price-right"><span class="need-pv-price-amt">Ready</span></span></li>' +
            '<li class="need-pv-price"><span class="need-pv-price-name">The other store</span><span class="need-pv-price-right"><span class="need-pv-price-amt">Waiting</span></span></li>' +
            '<li class="need-pv-price"><span class="need-pv-price-name">Keep the lower</span><span class="need-pv-price-right"><span class="need-pv-price-amt">Open</span></span></li>' +
            "</ul>";
        }
        shelf();
        new MutationObserver(shelf).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
