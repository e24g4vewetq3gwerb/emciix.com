# Dependabot version updates.
# This repo is a static site with no package.json at the root, so only the
# GitHub Actions used by the workflows are tracked. If an npm manifest is ever
# added, add an "npm" entry here with the directory that holds package.json.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"
