name: Galactic ledger

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [galactic-call]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: galactic-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync the public ledger
        env:
          CALL_JSON: ${{ toJson(github.event.client_payload) }}
        run: node scripts/sync-ledger.mjs
      - name: Commit ledger
        run: |
          git config user.name "emciix"
          git config user.email "emciix@users.noreply.github.com"
          git add calls/ledger.json
          if git diff --cached --quiet; then
            echo "no ledger change"
            exit 0
          fi
          git commit -m "Update the public galactic call ledger"
          git push
