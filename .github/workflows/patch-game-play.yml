name: Patch game play start screen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - game/play/index.html
      - game/play/game.js
      - game/play/game.css
      - game/play/start-hub.css
      - game/play/start-hub.js
      - game/play/start-login.css
      - game/play/start-login.js
      - game/play/session-name.css
      - game/play/session-name.js
      - game/play/theme-room.css
      - game/play/theme-vacant.css
      - game/play/vacant-mode.js
      - game/play/vacant-chairs.css
      - game/play/universe-boot.js
      - game/play/favicon.svg
      - game/play/firebase-scores.js
      - game/play/session-guest.js
      - game/play/levels.json
      - game/play/levels/the-bot-can-wait/**
      - game/play/levels/fix-the-profile/**
      - game/play/levels/everything-passing-through/**
      - game/play/levels/thats-the-fix-x-fix-the-profile/**
      - game/play/levels/fix-the-profile-x-thats-the-fix/**
      - game/play/levels/no-room-for-me/**
      - game/play/levels/glitch-by-glitch/**
      - game/play/levels/watch-it-brppp/**
      - game/play/levels/starslip/**
      - game/play/levels/idk-what-im-doing/**
      - scripts/patch-hosting.mjs
      - views-boot.js
      - shelf-boot.js
      - stats-boot.js
      - index.html
      - app.js
      - need/assets/index-Bsi7rUKP.js
      - portal/**
      - need/index.html
      - need/wide.css
      - delta.html
      - starslip/**
      - roadtoamillion/**
      - hire/**
      - demo/**
      - assets/home/**
      - downloads/**
      - faast-wash/**
      - faast/**
      - scripts/faast-hosting.json
      - .github/workflows/patch-game-play.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Patch live hosting files
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/patch-hosting.mjs
