name: Patch game play start screen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - game/play/index.html
      - game/play/game.js
      - game/play/favicon.svg
      - game/play/levels.json
      - game/play/levels/no-room-for-me/**
      - scripts/patch-hosting.mjs
      - views-boot.js
      - shelf-boot.js
      - stats-boot.js
      - index.html
      - app.js
      - need/assets/index-Bsi7rUKP.js
      - portal/**
      - .github/workflows/patch-game-play.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch live hosting files
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: node scripts/patch-hosting.mjs
