name: One-off security fix (CodeQL alerts)

# Temporary workflow: applies .github/security-fix.patch once, then is deleted.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and commit the reviewed patch
        run: |
          git config user.name "emciix"
          git config user.email "emciix@users.noreply.github.com"
          git apply --check .github/security-fix.patch
          git apply .github/security-fix.patch
          git rm -q .github/security-fix.patch
          git add app.js game/play/game.js delta.html scripts/patch-hosting.mjs
          git commit -m "Fix CodeQL alerts: YouTube postMessage origin allowlist, blob-only previews, private temp dir" \
            -m "- app.js: accept YouTube player messages only from exact YouTube origins (code scanning #6 #7 #12 #13)" \
            -m "- game/play/game.js: exact provider-id match (#4 #5), blob: guard on avatar preview (#3)" \
            -m "- delta.html: blob: guard on local audio file (#2)" \
            -m "- scripts/patch-hosting.mjs: mkdtemp scratch dir instead of fixed /tmp paths (#8-#11)"
          git pull --rebase
          git push
