<style>
:root {
  --bg: #000; --card: #0c0c0d; --card-2: #121214;
  --line: rgba(255,255,255,.12); --line-2: rgba(255,255,255,.22);
  --ink: #f4f3f0; --dim: #a3a19b; --gold: #f2d48a;
  --pill: #f2f2f4; --pill-ink: #121212; --r: 18px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 76px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; padding-bottom: 80px; overflow-x: hidden; }
@media (min-width: 820px) { body { padding-bottom: 0; } }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 64% 42%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 30% 66%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 8% 88%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 48% 8%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 22% 40%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 92% 46%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 52% 92%, rgba(255,255,255,.3), transparent 60%); }
img { display: block; max-width: 100%; height: auto; }
a { color: var(--gold); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.wrap { width: min(1080px, 100%); margin: 0 auto; padding-left: 20px; padding-right: 20px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--pill); color: var(--pill-ink); padding: 8px 14px; border-radius: 999px; z-index: 60; }
.skip:focus { left: 12px; }

/* Header */
.head { position: sticky; top: 0; z-index: 40; background: rgba(0,0,0,.78); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 62px; padding-top: env(safe-area-inset-top); }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 750; letter-spacing: .12em; font-size: 1rem; }
.brand small { font-weight: 500; letter-spacing: .02em; color: var(--dim); font-size: .8rem; }
.dot { position: relative; display: block; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe6a8, #c9a227 55%, #3a2c08 100%); box-shadow: 0 0 0 1.5px rgba(255,255,255,.8), 0 0 16px rgba(242,212,138,.35); }
nav.main { display: none; gap: 22px; }
nav.main a { color: var(--dim); text-decoration: none; font-size: .92rem; font-weight: 600; }
nav.main a:hover { color: var(--ink); }
@media (min-width: 900px) { nav.main { display: flex; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: 600 1rem/1 var(--font); text-decoration: none; border: 1px solid var(--line-2); color: var(--ink); background: transparent; white-space: nowrap; }
.btn-primary { background: var(--pill); color: var(--pill-ink); border-color: var(--pill); }
.btn-primary:hover { background: #fff; }
.btn-ghost:hover { border-color: rgba(255,255,255,.5); }
.btn-sm { min-height: 38px; padding: 0 16px; font-size: .9rem; }
.btn-text { border-color: transparent; color: var(--gold); padding: 0 8px; }
.btn-text:hover { text-decoration: underline; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Hero */
.hero { position: relative; padding-top: 44px; padding-bottom: 34px; }
.kicker { font: 500 .72rem/1.3 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
h1 { font-size: clamp(2.2rem, 9vw, 4.2rem); line-height: 1.03; letter-spacing: -.025em; margin: 0 0 18px; font-weight: 700; max-width: 15ch; text-wrap: balance; }
h1 .soft { color: var(--dim); }
.lede { font-size: clamp(1.05rem, 3.6vw, 1.22rem); color: #d7d5cf; max-width: 38rem; margin: 0 0 26px; }
.planet { display: none; }
@media (min-width: 1040px) {
  .planet { display: block; position: absolute; right: 40px; top: 90px; width: 270px; height: 270px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 34% 30%, #ffe9b0 0%, #d9b24a 34%, #8a6a1c 68%, #1e1604 100%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 60px rgba(242,212,138,.28); }
  .planet::after { content: ""; position: absolute; inset: -5%; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); }
  .moon { position: absolute; right: -6px; top: 18px; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f4f3f0, #8f8d88 70%, #2a2a2a); box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }
}
@media (min-width: 720px) { .hero { padding-top: 84px; padding-bottom: 60px; } }

/* Cards row */
.cards { display: grid; gap: 14px; grid-template-columns: 1fr; padding-bottom: 44px; }
@media (min-width: 760px) { .cards { grid-template-columns: repeat(3, 1fr); } }
.card { background: linear-gradient(180deg, var(--card-2), var(--card)); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.card h3 { margin: 0 0 6px; font-size: 1.12rem; font-weight: 650; }
.card p { margin: 0; color: #cfcdc7; font-size: .96rem; }
.info-card { display: flex; flex-direction: column; }
.info-card p { flex: 1; }
.info-card a { margin-top: 12px; font-weight: 600; font-size: .95rem; }
.ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line-2); margin-bottom: 14px; color: var(--gold); }
.ico svg { width: 20px; height: 20px; }

/* Sections */
section.block { padding: 48px 0; border-top: 1px solid var(--line); }
@media (min-width: 720px) { section.block { padding: 68px 0; } }
h2 { font-size: clamp(1.6rem, 5.6vw, 2.4rem); line-height: 1.12; letter-spacing: -.02em; margin: 0 0 10px; font-weight: 700; text-wrap: balance; }
.sub { color: var(--dim); margin: 0 0 22px; max-width: 40rem; }
.split { display: grid; gap: 22px; align-items: center; }
@media (min-width: 880px) { .split { grid-template-columns: 1.05fr .95fr; gap: 44px; } .split.flip > :first-child { order: 2; } }
ul.ticks { list-style: none; padding: 0; margin: 0 0 24px; color: #cfcdc7; }
ul.ticks li { position: relative; padding-left: 22px; margin: 6px 0; }
ul.ticks li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); opacity: .85; }
.shot { display: block; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-2); background: #0a0a0a; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.shot img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; }
.stat { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); }
.stat b { display: block; font-size: 1.6rem; line-height: 1.1; letter-spacing: -.02em; }
.stat span { color: var(--dim); font-size: .82rem; }
.status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .92rem; color: var(--ink); border: 1px solid rgba(242,212,138,.4); background: rgba(242,212,138,.08); border-radius: 999px; padding: 7px 14px; margin: 0 0 18px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px rgba(242,212,138,.8); }
.phone { width: min(260px, 70%); margin: 0 auto; aspect-ratio: 9 / 19; border-radius: 38px; border: 2px solid rgba(255,255,255,.28); background: radial-gradient(circle at 50% 42%, rgba(242,212,138,.12), transparent 60%), #030303; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
.phone::before { content: ""; position: absolute; left: 50%; top: 12px; width: 32%; height: 20px; border-radius: 12px; background: #111; transform: translateX(-50%); }
.phone .p-planet { position: absolute; left: 50%; top: 42%; width: 44%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle at 34% 30%, #ffe9b0 0%, #d9b24a 34%, #8a6a1c 68%, #1e1604 100%); box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 40px rgba(242,212,138,.3); }
.phone .p-orb { position: absolute; width: 13%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9fd3ff, #2d6aa0 60%, #0b1c2c); box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }
.phone .p-star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .7; }
.phone .p-bar { position: absolute; left: 10%; right: 10%; bottom: 7%; height: 11%; border-radius: 18px; border: 1px solid rgba(255,255,255,.22); background: rgba(18,18,20,.9); display: flex; align-items: center; justify-content: center; font: 600 .7rem/1 var(--mono); letter-spacing: .2em; color: var(--dim); }

/* Services */
.plans { display: grid; gap: 14px; margin-bottom: 22px; }
@media (min-width: 640px) { .plans { grid-template-columns: 1fr 1fr; } }
@media (min-width: 640px) { .plans .card-wide { grid-column: 1 / -1; } .plans .card-wide ul.ticks { columns: 2; column-gap: 28px; } .plans .card-wide ul.ticks li { break-inside: avoid; } }

.plan-cta { margin-top: auto; padding-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.plan-cta .alt { font-size: .9rem; color: var(--dim); }
.plan-cta .alt a { color: var(--ink); }
.card .price { color: var(--ink); font-size: 2rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 6px; }
.price-note { color: var(--dim); font-size: .85rem; margin: -8px 0 20px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.card .price small { font-size: .9rem; font-weight: 500; color: var(--dim); letter-spacing: 0; }

/* Gallery */
.gallery { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 600px) { .gallery { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .gallery { grid-template-columns: repeat(4, 1fr); } }
.tile { display: block; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

  h += '<section class="block" id="game" aria-labelledby="game-h"><div class="wrap split flip"><div>' + head(G.kicker, G.title, "game-h") +
    '<p class="sub">' + esc(G.text) + '</p><div class="stats">' + G.stats.map(function (s) { return '<div class="stat"><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>'; }).join("") + '</div>' +
    ticks(G.points) + links(G.links) + '</div>' +
    '<a class="shot" href="/game/play"><img src="/assets/home/game.webp" alt="Rhythm game start screen" width="640" height="400" decoding="async" /></a></div></section>';

  var T = S.starslip;
  h += '<section class="block" id="starslip" aria-labelledby="starslip-h"><div class="wrap split"><div>' + head(T.kicker, T.title, "starslip-h") +
    '<p class="status">' + esc(T.status) + '</p><p class="sub">' + esc(T.text) + '</p>' + links(T.links) + '</div>' +
    '<div class="phone" role="img" aria-label="Illustration of Starslip on an iPhone"><span class="p-star" style="left:18%;top:20%"></span><span class="p-star" style="left:78%;top:16%"></span><span class="p-star" style="left:66%;top:64%"></span><span class="p-star" style="left:26%;top:72%"></span><span class="p-star" style="left:48%;top:12%"></span>' +
    '<span class="p-planet"></span><span class="p-orb" style="left:14%;top:52%"></span><span class="p-orb" style="left:72%;top:26%"></span><span class="p-orb" style="left:68%;top:58%;width:10%"></span><span class="p-bar">PORTAL</span></div></div></section>';

  var V = S.services;
  h += '<section class="block" id="hire" aria-labelledby="hire-h"><div class="wrap">' + head(V.kicker, V.title, "hire-h") + '<p class="sub">' + esc(V.text) + '</p>' +
    '<div class="plans">' + V.plans.map(function (p) {
      return '<article class="card' + (p.wide ? ' card-wide' : '') + '"' + (p.id ? ' id="' + esc(p.id) + '"' : '') + '><h3>' + esc(p.name) + '</h3><p class="price">' + esc(p.price) + (p.unit ? ' <small>' + esc(p.unit) + '</small>' : '') + '</p><p>' + esc(p.text) + '</p>' +
        (p.points ? ticks(p.points) : '') +
        (p.book ? '<div class="plan-cta"><a class="btn btn-ghost btn-sm" href="' + esc(p.book.tel) + '">' + I.phone + esc(p.book.label) + '</a><span class="alt">or <a href="' + esc(p.book.mail) + '">email</a></span></div>' : '') +
        '</article>';
    }).join("") + '</div>' +
    (V.note ? '<p class="price-note">' + esc(V.note) + '</p>' : '') + links(V.links) + '</div></section>';

  var CD = S.cityDemo;
  h += '<section class="block" id="city-demo" aria-labelledby="city-h"><div class="wrap">' + head(CD.kicker, CD.title, "city-h") + '<p class="sub">' + esc(CD.text) + '</p>' +
    '<div class="seg" role="tablist" aria-label="Demo version">' + CD.tabs.map(function (t, i) {
      return '<button type="button" role="tab" id="city-tab-' + i + '" aria-controls="city-panel" aria-selected="' + (i === 0) + '" tabindex="' + (i === 0 ? 0 : -1) + '" data-i="' + i + '">' + esc(t.label) + '</button>';
    }).join("") + '</div>' +
    '<form class="city-form" id="city-form" hidden><label class="sr-only" for="city-in">Your city</label><input id="city-in" type="text" maxlength="48" placeholder="e.g. Berlin, Germany" autocomplete="off" spellcheck="false" /><button class="btn btn-ghost btn-sm" type="submit">Preview</button></form>' +
    '<div class="bframe" id="city-panel" role="tabpanel" aria-labelledby="city-tab-0"><div class="bbar"><span class="bdots" aria-hidden="true"><i></i><i></i><i></i></span><span class="burl" id="city-url">emciix.com/demo/roofing</span></div>' +
    '<div class="bview" id="city-view"><iframe id="city-frame" src="/demo/roofing" title="Live preview of the Northshore Roofing demo site" loading="lazy" sandbox="allow-scripts" referrerpolicy="same-origin" tabindex="-1" aria-hidden="true"></iframe></div></div>' +
    '<div class="row"><a class="btn btn-primary" id="city-open" href="/demo/roofing">Open full demo</a></div></div></section>';

  h += '<section class="block" id="work" aria-labelledby="work-h"><div class="wrap"><p class="kicker">Gallery</p><h2 id="work-h">Built here</h2><p class="sub">Everything on this site is designed and built by Need.</p><div class="gallery">' +
    S.gallery.map(function (g) { return '<a class="tile" href="' + esc(g.href) + '"><img src="' + esc(g.img) + '" alt="' + esc(g.alt) + '" width="640" height="400" decoding="async" /><div><b>' + esc(g.title) + '</b><span class="tag">' + esc(g.tag) + '</span></div></a>'; }).join("") +
    '</div></div></section>';

  h += '<section class="block" id="faq" aria-labelledby="faq-h"><div class="wrap"><p class="kicker">FAQ</p><h2 id="faq-h">Questions</h2><div class="faq">' +
    S.faq.map(function (f, i) { return '<details' + (i === 0 ? " open" : "") + '><summary>' + esc(f[0]) + '</summary><p>' + esc(f[1]) + '</p></details>'; }).join("") +
    '</div></div></section></main>';

  var F = S.footer;
  h += '<footer><div class="wrap"><div class="foot-grid"><div class="about"><a class="brand" href="/"><span class="dot" aria-hidden="true"></span>' + esc(S.brand.name) + '</a>' +
    '<p>Music, games &amp; web builds by ' + esc(S.brand.by) + '. Working remotely, worldwide.</p>' +
    '<div class="cx" id="contact"><button type="button" class="cx-btn" id="contact-btn" aria-expanded="false" aria-controls="contact-list">Contact <span class="cx-chev" aria-hidden="true"></span></button>' +
    '<div class="cx-panel" id="contact-list" role="region" aria-labelledby="contact-btn"><div class="cx-inner"><ul><li><a href="tel:' + esc(K.phoneTel) + '">' + esc(K.phoneDisplay) + '</a></li><li><a href="mailto:' + esc(K.email) + '">' + esc(K.email) + '</a></li><li><a href="' + esc(K.x) + '" rel="noopener">X ' + esc(K.xHandle) + '</a></li><li><a href="' + esc(K.youtube) + '" rel="noopener">YouTube: ' + esc(K.youtubeName) + '</a></li><li><a href="' + esc(K.linkedin) + '" target="_blank" rel="noopener me">LinkedIn: ' + esc(K.linkedinName) + '</a></li></ul></div></div></div></div>' +
    F.columns.map(function (c) { return '<div><h2>' + esc(c.title) + '</h2><ul>' + c.links.map(function (l) { return '<li><a href="' + esc(l[1]) + '">' + esc(l[0]) + '</a></li>'; }).join("") + '</ul></div>'; }).join("") +
    '</div><div class="foot-base"><span>' + esc(F.note) + '</span><span>No trackers · No ads</span></div></div></footer>';

  h += '<nav class="mbar" aria-label="Quick actions">' + S.mobileBar.map(function (l) { return link(l); }).join("") + '</nav>';

  document.getElementById("app").innerHTML = h;

  // ---------- look switch: dark (gold) -> alt (light trades) -> global (neutral blue) -> dark ----------
  var MODES = ["dark", "alt", "global"];
  var MODE_NAMES = { dark: "Dark", alt: "Light", global: "Global" };
  var MODE_THEME = { dark: "#000000", alt: "#ffffff", global: "#ffffff" };
  var rootEl = document.documentElement, btn = document.getElementById("mode-btn");
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var live = document.createElement("span");
  live.className = "sr-only"; live.setAttribute("aria-live", "polite"); live.id = "mode-live";
  document.body.appendChild(live);
  function currentMode() { var m = rootEl.getAttribute("data-mode"); return MODES.indexOf(m) > 0 ? m : "dark"; }
  function applyMode(mode, animate) {
    if (animate && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) {
      rootEl.classList.add("mode-anim");
      clearTimeout(applyMode.t);
      applyMode.t = setTimeout(function () { rootEl.classList.remove("mode-anim"); }, 500);
    }
    if (mode === "dark") rootEl.removeAttribute("data-mode"); else rootEl.setAttribute("data-mode", mode);
    var label = "Switch look (current: " + MODE_NAMES[mode] + ")";
    btn.setAttribute("aria-label", label);
    btn.setAttribute("title", label);
    if (themeMeta) themeMeta.setAttribute("content", MODE_THEME[mode]);
    if (animate) live.textContent = MODE_NAMES[mode] + " look";
  }
  applyMode(currentMode(), false);
  btn.addEventListener("click", function () {
    var next = MODES[(MODES.indexOf(currentMode()) + 1) % MODES.length];
    applyMode(next, true);
    try { localStorage.setItem("emciix.homeMode", next); } catch (e) {}
  });

  // ---------- footer Contact disclosure (+ header nav link and #contact) ----------
  (function () {
    var btn = document.getElementById("contact-btn"), panel = document.getElementById("contact-list"), box = document.getElementById("contact");
    if (!btn || !panel) return;
    function reduced() { return !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
    function setOpen(open) { btn.setAttribute("aria-expanded", open ? "true" : "false"); panel.classList.toggle("open", open); }
    function reveal(animate) {
      setOpen(true);
      setTimeout(function () { box.scrollIntoView({ behavior: animate && !reduced() ? "smooth" : "auto", block: "center" }); }, animate && !reduced() ? 320 : 0);
    }
    btn.addEventListener("click", function () { setOpen(btn.getAttribute("aria-expanded") !== "true"); });
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest('a[href="#contact"]');
      if (!a) return;
      e.preventDefault();
      if (history.replaceState) history.replaceState(null, "", "#contact");
      btn.focus({ preventScroll: true });
      reveal(true);
    });
    window.addEventListener("hashchange", function () { if (location.hash === "#contact") reveal(true); });
    if (location.hash === "#contact") {
      reveal(false);
      window.addEventListener("load", function () { reveal(false); });
    }
  })();

  // ---------- Built for your city: tabs + scaled live preview ----------
  (function () {
    var tabs = [].slice.call(document.querySelectorAll('#city-demo [role="tab"]')), frame = document.getElementById("city-frame"),
      view = document.getElementById("city-view"), form = document.getElementById("city-form"), input = document.getElementById("city-in"),
      open = document.getElementById("city-open"), url = document.getElementById("city-url"), panel = document.getElementById("city-panel");
    if (!frame || !tabs.length) return;
    function clean(v) {   // same rules as the demo: letters, digits, spaces, . , ' - ( ), max 48
      return String(v || "").replace(/[\u2018\u2019]/g, "'").replace(/[^\p{L}\p{M}\p{N} .,'()\-]/gu, "").replace(/\s+/g, " ").replace(/\s*,\s*/g, ", ")
        .replace(/^[\s,]+|[\s,]+$/g, "").slice(0, 48).replace(/[\s,]+$/, "");
    }
    var cur = frame.getAttribute("src");
    function show(city) {
      var href = "/demo/roofing" + (city ? "?city=" + encodeURIComponent(city) : "");
      if (cur !== href) {   // swap in a fresh iframe: no race with a pending load, no extra history entries
        cur = href;
        var nf = frame.cloneNode(false);
        nf.setAttribute("src", href);
        frame.parentNode.replaceChild(nf, frame);
        frame = nf;
      }
      open.setAttribute("href", href);
      url.textContent = "emciix.com/demo/roofing" + (city ? "?city=" + city : "");
    }
    function select(i, focus) {
      tabs.forEach(function (t, j) { t.setAttribute("aria-selected", String(j === i)); t.tabIndex = j === i ? 0 : -1; });
      panel.setAttribute("aria-labelledby", tabs[i].id);
      if (focus) tabs[i].focus();
      var city = S.cityDemo.tabs[i].city;
      form.hidden = city !== null;
      if (city !== null) show(city);
      else if (clean(input.value)) show(clean(input.value));
    }
    tabs.forEach(function (t, i) {
      t.addEventListener("click", function () { select(i, false); if (S.cityDemo.tabs[i].city === null) input.focus(); });
      t.addEventListener("keydown", function (e) {
        var k = e.key, n = tabs.length, j = k === "ArrowRight" ? (i + 1) % n : k === "ArrowLeft" ? (i + n - 1) % n : k === "Home" ? 0 : k === "End" ? n - 1 : -1;
        if (j < 0) return; e.preventDefault(); select(j, true);
      });
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var c = clean(input.value);
      input.value = c;
      if (c) show(c); else input.focus();
    });
    // Render the demo at a real viewport size (desktop, or phone on narrow screens) and scale it to fit the card.
    function fit() {
      var cw = view.clientWidth; if (!cw) return;
      var vw = cw < 560 ? 390 : 1280, vh = cw < 560 ? 740 : 800, k = cw / vw;
      frame.style.width = vw + "px"; frame.style.height = vh + "px"; frame.style.transform = "scale(" + k + ")";
      view.style.height = Math.round(vh * k) + "px";
    }
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(view); else window.addEventListener("resize", fit);
  })();

  var ld = { "@context": "https://schema.org", "@graph": [
    { "@type": "WebSite", "name": S.brand.name, "url": S.brand.url },
    { "@type": "Organization", "name": S.brand.by, "alternateName": S.brand.name, "url": S.brand.url, "telephone": K.phoneTel, "email": K.email, "sameAs": [K.x, K.youtube, K.linkedin] }
  ] };
  var tag = document.createElement("script"); tag.type = "application/ld+json"; tag.textContent = JSON.stringify(ld); document.head.appendChild(tag);
})();
</script>
