<style>
:root {
  --bg: #000; --card: #0c0c0d; --card-2: #121214;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 76px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; padding-bottom: 80px; overflow-x: hidden; }
@media (min-width: 820px) { body { padding-bottom: 0; } }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 64% 42%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 30% 66%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 8% 88%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 48% 8%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 22% 40%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 92% 46%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 52% 92%, rgba(255,255,255,.3), transparent 60%); }
img { display: block; max-width: 100%; height: auto; }
a { color: var(--gold); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.wrap { width: min(1080px, 100%); margin: 0 auto; padding-left: 20px; padding-right: 20px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--pill); color: var(--pill-ink); padding: 8px 14px; border-radius: 999px; z-index: 60; }
.skip:focus { left: 12px; }

/* Header */
.head { position: sticky; top: 0; z-index: 40; background: rgba(0,0,0,.78); backdrop-filter: blur(10px); border-bottom: 1px solid transparent; }
.head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 62px; padding-top: env(safe-area-inset-top); }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 750; letter-spacing: .12em; font-size: 1rem; }
.brand small { font-weight: 500; letter-spacing: .02em; color: var(--dim); font-size: .8rem; }
.dot { position: relative; display: block; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe6a8, #c9a227 55%, #3a2c08 100%); box-shadow: 0 0 0 1.5px rgba(255,255,255,.8), 0 0 16px rgba(242,212,138,.35); }
nav.main { display: none; gap: 22px; }
nav.main a { color: var(--dim); text-decoration: none; font-size: .92rem; font-weight: 600; }
nav.main a:hover { color: var(--ink); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; font: 600 1rem/1 var(--font); text-decoration: none; border: 1px solid var(--line-2); color: var(--ink); background: transparent; white-space: nowrap; }
.btn-primary { background: var(--pill); color: var(--pill-ink); border-color: var(--pill); }
.btn-primary:hover { background: #fff; }
.btn-ghost:hover { border-color: rgba(255,255,255,.5); }
.btn-sm { min-height: 38px; padding: 0 16px; font-size: .9rem; }
.btn-text { border-color: transparent; color: var(--gold); padding: 0 8px; }
.btn-text:hover { text-decoration: underline; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Hero */
.hero { position: relative; padding-top: 44px; padding-bottom: 34px; }
.kicker { font: 500 .72rem/1.3 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; padding: 0; list-style: none; }
.chips li { font-size: .85rem; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }

@media (min-width: 1040px) {
  .planet { display: block; position: absolute; right: 40px; top: 90px; width: 270px; height: 270px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 34% 30%, #ffe9b0 0%, #d9b24a 34%, #8a6a1c 68%, #1e1604 100%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 60px rgba(242,212,138,.28); }
  .planet::after { content: ""; position: absolute; inset: -5%; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); }
  .moon { position: absolute; right: -6px; top: 18px; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f4f3f0, #8f8d88 70%, #2a2a2a); box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }
}
@media (min-width: 720px) { .hero { padding-top: 84px; padding-bottom: 60px; } }

/* Cards row */
.cards { display: grid; gap: 14px; grid-template-columns: 1fr; padding-bottom: 44px; }
@media (min-width: 760px) { .cards { grid-template-columns: repeat(3, 1fr); } }
.card { background: linear-gradient(180deg, var(--card-2), var(--card)); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.card h3 { margin: 0 0 6px; font-size: 1.12rem; font-weight: 650; }
.card p { margin: 0; color: #cfcdc7; font-size: .96rem; }
.info-card { display: flex; flex-direction: column; }
.info-card p { flex: 1; }

.ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line-2); margin-bottom: 14px; color: var(--gold); }
.ico svg { width: 20px; height: 20px; }

/* Sections */
section.block { padding: 48px 0; border-top: 1px solid var(--line); }
@media (min-width: 720px) { section.block { padding: 68px 0; } }
h2 { font-size: clamp(1.6rem, 5.6vw, 2.4rem); line-height: 1.12; letter-spacing: -.02em; margin: 0 0 10px; font-weight: 700; text-wrap: balance; }
.sub { color: var(--dim); margin: 0 0 22px; max-width: 40rem; }
.split { display: grid; gap: 22px; align-items: center; }
@media (min-width: 880px) { .split { grid-template-columns: 1.05fr .95fr; gap: 44px; } .split.flip > :first-child { order: 2; } }
ul.ticks { list-style: none; padding: 0; margin: 0 0 24px; color: #cfcdc7; }
ul.ticks li { position: relative; padding-left: 22px; margin: 6px 0; }
ul.ticks li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); opacity: .85; }
.shot { display: block; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-2); background: #0a0a0a; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.shot img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; }
.stat { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); }
.stat b { display: block; font-size: 1.6rem; line-height: 1.1; letter-spacing: -.02em; }
.stat span { color: var(--dim); font-size: .82rem; }
.status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .92rem; color: var(--ink); border: 1px solid rgba(242,212,138,.4); background: rgba(242,212,138,.08); border-radius: 999px; padding: 7px 14px; margin: 0 0 18px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px rgba(242,212,138,.8); }
.phone { width: min(260px, 70%); margin: 0 auto; aspect-ratio: 9 / 19; border-radius: 38px; border: 2px solid rgba(255,255,255,.28); background: radial-gradient(circle at 50% 42%, rgba(242,212,138,.12), transparent 60%), #030303; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
.phone::before { content: ""; position: absolute; left: 50%; top: 12px; width: 32%; height: 20px; border-radius: 12px; background: #111; transform: translateX(-50%); }
.phone .p-planet { position: absolute; left: 50%; top: 42%; width: 44%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle at 34% 30%, #ffe9b0 0%, #d9b24a 34%, #8a6a1c 68%, #1e1604 100%); box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 40px rgba(242,212,138,.3); }
.phone .p-orb { position: absolute; width: 13%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9fd3ff, #2d6aa0 60%, #0b1c2c); box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); }

.plans { display: grid; gap: 14px; margin-bottom: 22px; }

.faq { display: grid; gap: 10px; max-width: 820px; }

/* ===== Look switch button (the header blob) ===== */
.brand-wrap { display: inline-flex; align-items: center; gap: 4px; margin-left: -8px; }
.mode-btn { appearance: none; -webkit-appearance: none; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; margin: 0; border: 0; border-radius: 12px; background: transparent; cursor: pointer; }
.mode-btn:hover .dot { transform: scale(1.08); }
.mode-btn:active .dot { transform: scale(.94); }
.mode-btn .dot { transition: transform .2s ease; }
.dot::before { content: ""; position: absolute; left: 50%; top: 58%; width: 9px; height: 9px; border-top: 3px solid #e8702a; border-left: 3px solid #e8702a; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; }

/* Smooth switch (class only added while toggling, so no first-paint animation) */
html.mode-anim body, html.mode-anim body *, html.mode-anim body::before, html.mode-anim body *::before, html.mode-anim body *::after {
  transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease, opacity .35s ease, border-radius .35s ease, background .35s ease !important;
}

  --bg: #f6f5f2; --card: #ffffff; --card-2: #ffffff;
  --line: #e3e1dc; --line-2: #cfd3d9;
  --ink: #18212e; --dim: #5b6573; --gold: #e8702a;
  --navy: #1f3a5f; --orange: #e8702a;
  --r: 14px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
}
html[data-mode="alt"] body { background: var(--bg); color: var(--ink); }
html[data-mode="alt"] body::before { opacity: 0; }
html[data-mode="alt"] a { color: var(--navy); }
html[data-mode="alt"] .head { background: rgba(255,255,255,.96); border-bottom-color: var(--line); }
html[data-mode="alt"] .brand { color: var(--ink); font-weight: 800; }
html[data-mode="alt"] nav.main a { color: var(--ink); }
html[data-mode="alt"] nav.main a:hover { color: var(--navy); text-decoration: underline; }
html[data-mode="alt"] .dot { border-radius: 8px; background: var(--navy); box-shadow: 0 1px 3px rgba(16,24,40,.25); width: 28px; height: 28px; }
html[data-mode="alt"] .dot::before { opacity: 1; }
html[data-mode="alt"] .mode-btn:focus-visible { outline-color: var(--orange); }
html[data-mode="alt"] :focus-visible { outline-color: var(--orange); }

html[data-mode="alt"] .btn { border-radius: 10px; font-weight: 700; }
html[data-mode="alt"] .btn-primary { background: var(--orange); border-color: var(--orange); color: #fff; }
html[data-mode="alt"] .btn-primary:hover { background: #d9641f; }
html[data-mode="alt"] .btn-ghost { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
html[data-mode="alt"] .btn-ghost:hover { background: var(--navy); color: #fff; }
html[data-mode="alt"] .btn-text { color: var(--navy); border-color: transparent; }

html[data-mode="alt"] .kicker { color: var(--orange); font-family: var(--font); font-weight: 800; letter-spacing: .12em; }
html[data-mode="alt"] h1 .soft { color: var(--dim); }
html[data-mode="alt"] .lede { color: var(--dim); }
html[data-mode="alt"] .chips li { background: #fff; border-color: var(--line); color: var(--ink); font-weight: 600; }
html[data-mode="alt"] .planet { background: radial-gradient(circle at 34% 30%, #ffd9b0 0%, #f39a52 36%, #e8702a 62%, #9c3f0c 100%); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--navy), 0 18px 40px rgba(16,24,40,.18); }
html[data-mode="alt"] .planet::after { border-color: rgba(31,58,95,.35); }
html[data-mode="alt"] .moon { background: radial-gradient(circle at 35% 30%, #8fa7c7, #1f3a5f 70%, #0f1d30); box-shadow: 0 0 0 2px #fff; }

html[data-mode="alt"] .card, html[data-mode="alt"] .stat, html[data-mode="alt"] .tile, html[data-mode="alt"] .faq details { background: #fff; border-color: var(--line); box-shadow: var(--shadow); }
html[data-mode="alt"] .card p, html[data-mode="alt"] ul.ticks, html[data-mode="alt"] .faq details p { color: var(--dim); }
html[data-mode="alt"] .card h3, html[data-mode="alt"] .card .price, html[data-mode="alt"] .stat b { color: var(--ink); }
html[data-mode="alt"] .info-card a { color: var(--navy); font-weight: 700; }
html[data-mode="alt"] .ico { border: 0; background: rgba(31,58,95,.09); color: var(--navy); border-radius: 12px; }
html[data-mode="alt"] ul.ticks li::before { background: var(--orange); opacity: 1; }
html[data-mode="alt"] section.block { border-top-color: var(--line); }
html[data-mode="alt"] section.block:nth-of-type(even) { background: #fff; }
html[data-mode="alt"] .shot { background: #fff; border-color: var(--line); box-shadow: var(--shadow); }
html[data-mode="alt"] .status { color: var(--ink); background: rgba(232,112,42,.1); border-color: rgba(232,112,42,.4); }
html[data-mode="alt"] .status::before { background: var(--orange); box-shadow: none; }
html[data-mode="alt"] .phone .p-planet { background: radial-gradient(circle at 34% 30%, #ffd9b0 0%, #f39a52 36%, #e8702a 62%, #9c3f0c 100%); }
html[data-mode="alt"] .phone { border-color: rgba(24,33,46,.55); box-shadow: 0 24px 50px rgba(16,24,40,.22); }
html[data-mode="alt"] .tag { color: var(--dim); border-color: var(--line); background: var(--bg); }
html[data-mode="alt"] .tile { color: var(--ink); }
html[data-mode="alt"] .faq summary::after { color: var(--orange); font-weight: 400; }

html[data-mode="alt"] footer { background: var(--navy); color: rgba(255,255,255,.86); border-top-color: var(--navy); }
html[data-mode="alt"] footer a, html[data-mode="alt"] footer .brand { color: #fff; }
html[data-mode="alt"] footer h2 { color: #fff; font-family: var(--font); font-weight: 800; }
html[data-mode="alt"] footer .dot { background: rgba(255,255,255,.12); }
html[data-mode="alt"] .foot-base { border-top-color: rgba(255,255,255,.18); color: rgba(255,255,255,.72); }

html[data-mode="alt"] .mbar { background: rgba(255,255,255,.97); border-top-color: var(--line); box-shadow: 0 -6px 18px rgba(16,24,40,.08); }
html[data-mode="alt"] .mbar .btn-ghost { background: var(--navy); border-color: var(--navy); color: #fff; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<noscript><div class="wrap"><h1>EMCIIX</h1><p>Music, games &amp; web builds from Sault Ste. Marie.</p><p><a href="/portal">Enter the portal</a> · <a href="/game/play">Play the game</a> · <a href="/hire">Hire me</a> · <a href="/starslip/support">Starslip</a> · <a href="mailto:cue@dialchad.com">cue@dialchad.com</a></p></div></noscript>
<div id="app"></div>

<script>
(function () {
  "use strict";
  var S = window.SITE, K = S.contact;
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function link(l, cls) {
    var ext = l.external || /^https?:/.test(l.href);
    return '<a class="btn ' + (cls || (l.primary ? "btn-primary" : "btn-ghost")) + '" href="' + esc(l.href) + '"' + (ext ? ' rel="noopener"' : "") + '>' + esc(l.label) + (ext ? " ↗" : "") + '</a>';
  }
  function links(arr) { return '<div class="row">' + arr.map(function (l) { return link(l); }).join("") + '</div>'; }
  function ticks(arr) { return '<ul class="ticks">' + arr.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>'; }
  function head(k, t, id) { return '<p class="kicker">' + esc(k) + '</p><h2 id="' + id + '">' + esc(t) + '</h2>'; }
  var I = {
    music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    game: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/></svg>',
    build: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 8h18M9 12l-2 2 2 2M15 12l2 2-2 2"/></svg>'
  };
  var H = S.hero, h = "";

  var isAlt = document.documentElement.getAttribute("data-mode") === "alt";
  h += '<header class="head"><div class="wrap"><div class="brand-wrap"><button type="button" class="mode-btn" id="mode-btn" aria-label="Switch look" aria-pressed="' + (isAlt ? "true" : "false") + '" title="Switch look"><span class="dot" aria-hidden="true"></span></button>' +
    '<a class="brand" href="/">' + esc(S.brand.name) + ' <small>by ' + esc(S.brand.by) + '</small></a></div>' +
    '<nav class="main" aria-label="Main"><a href="#music">Music</a><a href="#game">Game</a><a href="#starslip">Starslip</a><a href="#hire">Hire</a><a href="#faq">FAQ</a></nav>' +
    '<a class="btn btn-ghost btn-sm" href="' + esc(H.primary.href) + '">' + esc(H.primary.label) + '</a></div></header>';

  h += '<main id="main"><div class="wrap hero"><div class="planet" aria-hidden="true"><span class="moon"></span></div>' +
    '<p class="kicker">' + esc(H.kicker) + '</p>' +
    '<h1>' + esc(H.title) + ' <span class="soft">' + esc(H.titleSoft) + '</span></h1>' +
    '<p class="lede">' + esc(H.text) + '</p>' +
    '<div class="row">' + link(H.primary, "btn-primary") + link(H.secondary, "btn-ghost") + link(H.tertiary, "btn-text") + '</div>' +
    '<ul class="chips" aria-label="Highlights">' + H.chips.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join("") + '</ul></div>';

  h += '<div class="wrap cards">' + S.cards.map(function (c) {
    return '<article class="card info-card"><div class="ico">' + (I[c.icon] || "") + '</div><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p><a href="' + esc(c.link.href) + '">' + esc(c.link.label) + ' →</a></article>';
  }).join("") + '</div>';

  var M = S.music;
  h += '<section class="block" id="music" aria-labelledby="music-h"><div class="wrap split"><div>' + head(M.kicker, M.title, "music-h") +
    '<p class="sub">' + esc(M.text) + '</p>' + ticks(M.points) + links(M.links) + '</div>' +
    '<a class="shot" href="/portal"><img src="/assets/home/portal.webp" alt="The EMCIIX starfield portal" width="640" height="400" decoding="async" /></a></div></section>';

  var G = S.game;
  h += '<section class="block" id="game" aria-labelledby="game-h"><div class="wrap split flip"><div>' + head(G.kicker, G.title, "game-h") +
    '<p class="sub">' + esc(G.text) + '</p><div class="stats">' + G.stats.map(function (s) { return '<div class="stat"><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>'; }).join("") + '</div>' +
    ticks(G.points) + links(G.links) + '</div>' +
    '<a class="shot" href="/game/play"><img src="/assets/home/game.webp" alt="Rhythm game start screen" width="640" height="400" decoding="async" /></a></div></section>';

  var T = S.starslip;
  h += '<section class="block" id="starslip" aria-labelledby="starslip-h"><div class="wrap split"><div>' + head(T.kicker, T.title, "starslip-h") +
    '<p class="status">' + esc(T.status) + '</p><p class="sub">' + esc(T.text) + '</p>' + links(T.links) + '</div>' +
    '<div class="phone" role="img" aria-label="Illustration of Starslip on an iPhone"><span class="p-star" style="left:18%;top:20%"></span><span class="p-star" style="left:78%;top:16%"></span><span class="p-star" style="left:66%;top:64%"></span><span class="p-star" style="left:26%;top:72%"></span><span class="p-star" style="left:48%;top:12%"></span>' +
    '<span class="p-planet"></span><span class="p-orb" style="left:14%;top:52%"></span><span class="p-orb" style="left:72%;top:26%"></span><span class="p-orb" style="left:68%;top:58%;width:10%"></span><span class="p-bar">PORTAL</span></div></div></section>';

  var V = S.services;
  h += '<section class="block" id="hire" aria-labelledby="hire-h"><div class="wrap">' + head(V.kicker, V.title, "hire-h") + '<p class="sub">' + esc(V.text) + '</p>' +
    '<div class="plans">' + V.plans.map(function (p) { return '<article class="card"><h3>' + esc(p.name) + '</h3><p class="price">' + esc(p.price) + ' <small>' + esc(p.unit) + '</small></p><p>' + esc(p.text) + '</p></article>'; }).join("") + '</div>' +
    links(V.links) + '</div></section>';

  h += '<section class="block" id="work" aria-labelledby="work-h"><div class="wrap"><p class="kicker">Gallery</p><h2 id="work-h">Built here</h2><p class="sub">Everything on this site is designed and built by Need.</p><div class="gallery">' +
    S.gallery.map(function (g) { return '<a class="tile" href="' + esc(g.href) + '"><img src="' + esc(g.img) + '" alt="' + esc(g.alt) + '" width="640" height="400" decoding="async" /><div><b>' + esc(g.title) + '</b><span class="tag">' + esc(g.tag) + '</span></div></a>'; }).join("") +
    '</div></div></section>';

  h += '<section class="block" id="faq" aria-labelledby="faq-h"><div class="wrap"><p class="kicker">FAQ</p><h2 id="faq-h">Questions</h2><div class="faq">' +
    S.faq.map(function (f, i) { return '<details' + (i === 0 ? " open" : "") + '><summary>' + esc(f[0]) + '</summary><p>' + esc(f[1]) + '</p></details>'; }).join("") +
    '</div></div></section></main>';

  var F = S.footer;
  h += '<footer><div class="wrap"><div class="foot-grid"><div class="about"><a class="brand" href="/"><span class="dot" aria-hidden="true"></span>' + esc(S.brand.name) + '</a>' +
    '<p>Music, games &amp; web builds by ' + esc(S.brand.by) + ', from ' + esc(K.city) + ', ' + esc(K.region) + '.</p>' +
    '<ul><li><a href="mailto:' + esc(K.email) + '">' + esc(K.email) + '</a></li><li><a href="' + esc(K.x) + '" rel="noopener">X ' + esc(K.xHandle) + '</a></li><li><a href="' + esc(K.youtube) + '" rel="noopener">YouTube: ' + esc(K.youtubeName) + '</a></li><li><a href="' + esc(K.linkedin) + '" target="_blank" rel="noopener me">LinkedIn</a></li></ul></div>' +
    F.columns.map(function (c) { return '<div><h2>' + esc(c.title) + '</h2><ul>' + c.links.map(function (l) { return '<li><a href="' + esc(l[1]) + '">' + esc(l[0]) + '</a></li>'; }).join("") + '</ul></div>'; }).join("") +
    '</div><div class="foot-base"><span>' + esc(F.note) + '</span><span>No trackers · No ads</span></div></div></footer>';

  h += '<nav class="mbar" aria-label="Quick actions">' + S.mobileBar.map(function (l) { return link(l); }).join("") + '</nav>';

  document.getElementById("app").innerHTML = h;

  // ---------- look switch (dark gold <-> light trades) ----------
  var rootEl = document.documentElement, btn = document.getElementById("mode-btn");
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  function applyMode(alt, animate) {
    if (animate && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) {
      rootEl.classList.add("mode-anim");
      clearTimeout(applyMode.t);
      applyMode.t = setTimeout(function () { rootEl.classList.remove("mode-anim"); }, 500);
    }
    if (alt) rootEl.setAttribute("data-mode", "alt"); else rootEl.removeAttribute("data-mode");
    btn.setAttribute("aria-pressed", alt ? "true" : "false");
    if (themeMeta) themeMeta.setAttribute("content", alt ? "#ffffff" : "#000000");
  }
  applyMode(rootEl.getAttribute("data-mode") === "alt", false);
  btn.addEventListener("click", function () {
    var alt = rootEl.getAttribute("data-mode") !== "alt";
    applyMode(alt, true);
    try { localStorage.setItem("emciix.homeMode", alt ? "alt" : "dark"); } catch (e) {}
  });

  var ld = { "@context": "https://schema.org", "@graph": [
    { "@type": "WebSite", "name": S.brand.name, "url": S.brand.url },
    { "@type": "Organization", "name": S.brand.by, "alternateName": S.brand.name, "url": S.brand.url, "email": K.email, "sameAs": [K.x, K.youtube, K.linkedin],
      "address": { "@type": "PostalAddress", "addressLocality": K.city, "addressRegion": K.regionCode, "addressCountry": K.country } }
  ] };
  var tag = document.createElement("script"); tag.type = "application/ld+json"; tag.textContent = JSON.stringify(ld); document.head.appendChild(tag);
})();
</script>
</body>
