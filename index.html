<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>emciix.com — Velc air</title>
  <link rel="preconnect" href="https://www.youtube.com" />
  <style>
    :root { --bg:#070707; --ink:#f6f4ef; --gold:#d4af37; --gold-2:#ecd265; --mute:#9a9588; --card:#101010; --line:#2a2a28; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:var(--ink); font-family:ui-sans-serif,system-ui,sans-serif; }
    a { color:inherit; }
    header { padding:22px 20px 8px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); }
    .mark { letter-spacing:.18em; font-size:12px; color:var(--gold); font-weight:700; }
    .sub { font-size:12px; color:var(--mute); }
    header a { color:var(--gold-2); font-size:13px; text-decoration:none; }
    main { max-width:1100px; margin:0 auto; padding:20px 16px 80px; }
    .kicker { color:var(--gold); font-size:11px; letter-spacing:.2em; font-weight:700; margin-bottom:8px; }
    h1 { font-size:clamp(28px,6vw,52px); line-height:.95; margin-bottom:8px; }
    .featured-title { font-size:clamp(18px,3.4vw,28px); margin:10px 0 6px; }
    .meta { color:var(--mute); font-size:13px; margin-bottom:14px; }
    .player { position:relative; width:100%; background:#111; border:1px solid var(--line); border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
    .player img.poster { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-top:16px; }
    article.card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; }
    article.card:hover { border-color:var(--gold); }
    article.card img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#111; }
    article.card .body { padding:10px 12px 14px; }
    article.card h3 { font-size:15px; line-height:1.25; }
    article.card time { display:block; color:var(--mute); font-size:12px; margin-top:6px; }
    .status { color:var(--mute); font-size:13px; margin:8px 0 16px; }
    footer { color:var(--mute); font-size:12px; margin-top:48px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="mark">EMCIIX.COM</div>
      <div class="sub">Velc air · Need · a song · a town · a price</div>
    </div>
    <a href="https://www.youtube.com/channel/UCt8dYnrvcrZSCx9uS0aLBSQ" target="_blank" rel="noopener">YouTube channel →</a>
  </header>
  <main>
    <p class="kicker">NEWEST</p>
    <h1>Latest from the channel</h1>
    <p class="status" id="status">Pulling the live YouTube feed…</p>
    <div id="featured"></div>
    <section>
      <p class="kicker" style="margin-top:40px">ALL UPLOADS</p>
      <h2 style="font-size:22px;margin:0 0 16px">The rest of the shelf</h2>
      <div class="grid" id="grid"></div>
    </section>
    <footer>emciix.com</footer>
  </main>
  <script>
    const CHANNEL = "UCt8dYnrvcrZSCx9uS0aLBSQ";
    const RSS = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL;
    const FALLBACK = [
      ["dG8z3nQeDSI","Need Hired by Me.","2026-09-19T23:36:27+00:00"],
      ["txA5vV_9XG4","Unemployed in Love #youareoneofakind #games","2026-09-19T22:05:00+00:00"],
      ["05AgmKvd3NI","Make up shit","2026-09-19T20:02:00+00:00"],
      ["MP9AIxzx55o","Everybody But Me","2026-09-18T23:22:00+00:00"],
      ["RFqKvFDB0Hg","I Took Credit","2026-09-18T20:41:00+00:00"],
      ["o040u9wAZns","Two phones, zero social life","2026-09-18T08:33:00+00:00"],
      ["2bbplpfoL-c","Which phone is it ? iPhone or Android","2026-09-18T07:17:00+00:00"],
      ["53Jny0alg9g","Still here","2026-09-18T01:19:00+00:00"],
      ["cWy-1DZsHDg","XCode Swift Song","2026-09-18T00:25:00+00:00"],
      ["9-nGIe8mQ0M","Wake you up Avicii","2026-09-17T00:49:00+00:00"],
      ["Id4HSb9j8RA","You're Not Alone","2026-09-16T18:13:00+00:00"],
      ["oCWCYVTs3vM","IDK What I'm Doing","2026-09-16T17:30:00+00:00"],
      ["R7BunIbGheI","One More Light On","2026-09-16T10:13:00+00:00"]
    ].map(([id,title,published])=>({id,title,published}));
    function titleKey(t){return String(t||"").toLowerCase().replace(/#[\w]+/g," ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();}
    function ytUrl(id){return "https://www.youtube.com/watch?v="+id;}
    function thumb(id){return "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";}
    function when(iso){try{return new Date(iso).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"});}catch(e){return iso;}}
    function dedupe(videos){
      const byId=new Map(); videos.forEach(v=>{if(v.id&&!byId.has(v.id))byId.set(v.id,v);});
      const unique=[...byId.values()].sort((a,b)=>new Date(b.published)-new Date(a.published));
      const seen=new Set();
      return unique.filter(v=>{const k=titleKey(v.title); if(!k||seen.has(k))return !k; seen.add(k); return true;});
    }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    const status=document.getElementById("status"), featured=document.getElementById("featured"), grid=document.getElementById("grid");
    function render(videos,source){
      videos=dedupe(videos); if(!videos.length){status.textContent="No videos.";return;}
      const [hero,...rest]=videos;
      status.textContent=source+" · "+videos.length+" unique uploads";
      featured.innerHTML=`<div class="player"><img class="poster" alt="" src="${thumb(hero.id)}" /></div><h2 class="featured-title">${escapeHtml(hero.title)}</h2><p class="meta">${when(hero.published)} · <a href="${ytUrl(hero.id)}" target="_blank" rel="noopener">open on YouTube →</a></p>`;
      featured.querySelector(".player").addEventListener("click",()=>window.open(ytUrl(hero.id),"_blank","noopener"));
      grid.innerHTML=rest.map(v=>`<article class="card" data-id="${v.id}"><img alt="" src="${thumb(v.id)}" /><div class="body"><h3>${escapeHtml(v.title)}</h3><time>${when(v.published)}</time></div></article>`).join("");
      grid.querySelectorAll("article.card").forEach(card=>card.addEventListener("click",()=>window.open(ytUrl(card.dataset.id),"_blank","noopener")));
    }
    function parseRss2Json(json){return (json.items||[]).map(item=>{const m=String(item.link||item.guid||"").match(/[?&]v=([\w-]{11})/)||String(item.guid||"").match(/yt:video:([\w-]{11})/);return {id:m?m[1]:"",title:item.title,published:item.pubDate||item.published};}).filter(v=>v.id);}
    async function load(){
      try{
        const res=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(RSS),{cache:"no-store"});
        if(res.ok){const json=await res.json(); const videos=json.items?parseRss2Json(json):[]; if(videos.length){render(videos,"Live YouTube feed");return;}}
      }catch(e){}
      render(FALLBACK,"Cached shelf");
    }
    load();
  </script>
</body>
</html>
