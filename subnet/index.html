<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subnet — Emciix</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0f12; --ink:#f5f5f7; --dim:#a1a1a6; --line:#2c2c2e; --fill:#1c1c1e; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.4 var(--font); }
    main { max-width:720px; margin:0 auto; padding:28px 20px 64px; }
    a { color:inherit; }
    h1 { font-size:28px; letter-spacing:-.03em; margin:8px 0 6px; }
    p { color:var(--dim); margin:0 0 22px; }
    .back { font-size:14px; color:var(--dim); text-decoration:none; }
    article { background:var(--fill); border-radius:18px; padding:16px; margin:0 0 14px; }
    h2 { font-size:17px; margin:0 0 10px; letter-spacing:-.02em; }
    video, audio { width:100%; border-radius:12px; background:#000; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← Emciix</a>
    <h1>Subnet</h1>
    <p>Self-hosted. Not part of the 22.</p>
    <article>
      <h2>No Room for Me</h2>
      <video controls playsinline preload="none" src="/video/no-room-for-me.mp4"></video>
    </article>
    <article>
      <h2>You're Not Alone</h2>
      <video controls playsinline preload="none" src="/media/youre-not-alone.mp4"></video>
    </article>
  </main>
</body>
</html>
